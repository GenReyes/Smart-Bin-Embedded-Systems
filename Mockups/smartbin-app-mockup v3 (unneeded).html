  $('#sysBtn').textContent='Phone: '+(sysDark?'dark':'light');
  draw();try{history.replaceState(null,'','#'+s.id)}catch(e){}
}
let toastT=0,FB_WORKING_SAVED=null;
function toast(m){cur.toast=m;draw();clearTimeout(toastT);toastT=setTimeout(()=>{cur.toast='';draw()},2200)}
let xid=0;
function addAlert(st,sev,ic,title,meta,k){st.extra.unshift({id:'x'+(++xid),sev,ic,k:k||{fill:'full',temp:'sensor',humid:'sensor',gas:'sensor',tamper:'tamper',lock:'lock',truck:'pickup',calib:'setup'}[ic]||'setup',title,meta,ago:'now',m:0})}

/* ---------- actions ---------- */
function act(a,v){const st=cur,op=st.role==='operator';
  switch(a){
  case 'tab':st.screen=v;st.overlay='';st.fs=false;break;
  case 'theme':st.theme=theme(st)==='dark'?'light':'dark';break;
  case 'themeset':st.theme=v;break;
  case 'role':case 'roleset':{const r=a==='role'?(op?'collector':'operator'):v;if(r===st.role)return;
    /* v3: operator needs the PIN; collector is the default and needs nothing */
    if(r==='operator'){pinOpen(st,OP_PIN?'unlock':'set',false);break;}
    st.role=r;st.calib=false;st.dirty=false;if(st.screen==='sim')st.screen='overview';
    draw();return toast('Back to collector. Operator needs the PIN again.');}
  case 'pk':pinKey(st,v);break;
  case 'pinchange':pinOpen(st,'change',false);break;
  case 'pill':st.overlay='alerts';break;
  case 'close':st.overlay='';break;
  case 'popopen':st.overlay='';st.screen='alerts';break;
  case 'cmd':{const [c,k]=v.split(':'),b=st.bins[+k];
    if(c==='LOCK'){b.status='LOCKED';addAlert(st,'info','lock','Bin locked',b.name+' locked from the app');}
    if(c==='UNLOCK'){b.status='OK';addAlert(st,'success','check','Bin unlocked',b.name+' is open for use again','lock');}
    if(c==='CLEAR_TAMPER'){b.status='OK';b.sim.values.tamper=0;}
    if(c==='COLLECT')b.status='COLLECTING';
    if(c==='COLLECT_DONE'){b.status='OK';b.fill=0;b.weight=0;b.gas=Math.min(b.gas,48);addAlert(st,'success','truck','Collection complete',b.name+' is back to normal');}
    draw();return toast({LOCK:b.name+' is locked.',UNLOCK:b.name+' is unlocked.',CLEAR_TAMPER:'Tamper reset on '+b.name+'.',COLLECT:'Pickup started on '+b.name+'. The lid is open.',COLLECT_DONE:b.name+' is empty and back to normal.'}[c]+(st.link==='cloud'?' Sent through the cloud, so the bin can take a few seconds.':''));}
  case 'gear':st.sheetBin=+v;st.overlay='binedit';break;
  case 'tile':st.sheetBin=+v;st.overlay='bin';break;
  case 'binstep':st.sheetBin=clamp(st.sheetBin+(+v),0,st.bins.length-1);break;
  case 'prioall':st.prioAll=!st.prioAll;break;
  case 'bview':st.binView=v;break;
  case 'bfilter':st.binFilter=v;break;
  case 'akind':st.akind=v;st.alertShown=6;break;
  case 'arange':st.arange=v;st.alertShown=6;break;
  case 'markshown':shownAlerts(st).forEach(x=>st.readOver[x.id]=true);draw();return toast('Marked '+scopeTxt(st,shownAlerts(st).length)+' as read.');
  case 'aolder':st.alertShown+=6;break;
  case 'pickopen':st.pickAct=v;st.overlay='pick';break;
  case 'picksel':{const a=st.pickAct;if(a==='cbin')st.chartBin=v;else if(a==='ebin')st.envBin=+v;else if(a==='setbin'){st.selSet=+v;st.pinShown=false}else st.selSim=+v;st.overlay='';break;}
  case 'binsave':{const b=st.bins[st.sheetBin];st.overlay='';if(b.ip)st.link='live';draw();return toast('Saved '+b.name+'.');}
  case 'binremove':{const b=st.bins.splice(st.sheetBin,1)[0];st.overlay='';st.selSet=st.selSim=st.envBin=0;st.chartBin='all';draw();return toast(b.name+' removed.');}
  case 'addbin':st.addN=1;st.overlay='addbin';break;
  case 'addless':st.addN=Math.max(1,st.addN-1);break;
  case 'addmore':st.addN=Math.min(3,st.addN+1);break;
  case 'addgo':{for(let k=0;k<st.addN;k++){const n=st.bins.length+1;st.bins.push(mkBin('Bin '+String(n).padStart(2,'0'),'New location',{fill:0,weight:0,gas:40,rate:0}))}st.overlay='';draw();return toast('Added '+st.addN+' bin'+(st.addN>1?'s':'')+'. Tap SET to give each one an address.');}
  case 'range':st.range=+v;break;
  case 'cbin':st.chartBin=v;break;
  case 'emode':st.envMode=v;break;
  case 'ebin':st.envBin=+v;break;
  case 'fsopen':st.fs=true;st.fsKind=v;break;
  case 'fsclose':st.fs=false;break;
  case 'setbin':st.selSet=+v;st.pinShown=false;break;
  case 'sect':st.open[v]=!st.open[v];break;
  case 'caltog':{const b=st.bins[st.selSet];
    if(st.calib){const lost=st.dirty;st.calib=false;st.dirty=false;st.edit=null;draw();return toast(lost?'Calibration off. Unsaved changes were dropped.':'Calibration off. '+b.name+' is back to normal.');}
    st.calib=true;st.edit=clone(b.cal);st.dirty=false;addAlert(st,'info','calib','Calibration started',b.name+' is being calibrated');draw();return toast('Calibration mode on for '+b.name+'.');}
  case 'step':{const [k,dir]=v.split(':'),f=FIELDS[k];
    if(k==='tref'||k==='known'){st[k]=+clamp(st[k]+f[3]*dir,f[4],f[5]).toFixed(2);break;}
    if(!st.edit)return;st.edit[k]=+clamp(st.edit[k]+f[3]*dir,f[4],f[5]).toFixed(2);st.dirty=true;break;}
  case 'usenow':{if(!st.edit)return;const b=st.bins[st.selSet],d=eff(st,b,st.selSet);st.edit[v]=+d.dist.toFixed(1);if(v==='d_full')st.edit.d_full=Math.min(st.edit.d_full,st.edit.d_empty-1);st.dirty=true;draw();return toast('Took '+fmt(st.edit[v],1)+' cm from the sensor.');}
  case 'setoff':{if(!st.edit)return;const b=st.bins[st.selSet],raw=eff(st,b,st.selSet).temp_raw,off=+clamp(st.tref-raw,-10,10).toFixed(1);st.edit.temp_off=off;st.dirty=true;draw();return toast('Offset set to '+off+' C. Press SAVE to keep it.');}
  case 'gasreset':st.bins[st.selSet].acc=0;draw();return toast('Gas baseline cleared. It needs time in normal air to be accurate again.');
  case 'tare':return toast('Scale zeroed on '+st.bins[st.selSet].name+'.');
  case 'calw':return toast('Calibrated with '+st.known+' g.');
  case 'autolock':if(!st.edit)return;st.edit.auto_lock=st.edit.auto_lock?0:1;st.dirty=true;break;
  case 'save':{if(!st.edit)return;const e=st.edit,b=st.bins[st.selSet];
    if(e.d_full>=e.d_empty)return toast('Distance full must be smaller than distance empty.');
    Object.assign(b.cal,e);st.dirty=false;addAlert(st,'success','check','Settings saved',b.name+': empty '+e.d_empty+' cm, full '+e.d_full+' cm, alert at '+e.fill_th+'%','setup');draw();return toast('Saved to '+b.name+'.');}
  case 'cancel':st.edit=clone(st.bins[st.selSet].cal);st.dirty=false;draw();return toast('Changes dropped.');
  case 'reload':return toast('Read the latest values from '+st.bins[st.selSet].name+'.');
  case 'export':return toast('Bin list saved to Downloads.');
  case 'pin':st.pinShown=!st.pinShown;break;
  case 'btpair':{const w=BTC.until-Date.now();if(w>0){draw();return toast(st.bins[st.selSet].name+' stopped pairing after 3 wrong codes. Try again in '+Math.ceil(w/1000)+' s.');}
    BTC.fails=0;btNew();pinOpen(st,'bt',false);break;}
  case 'btscan':st.overlay='wifi';break;
  case 'wifisel':st.ssid=v;st.overlay='';break;
  case 'btshow':st.showPass=!st.showPass;break;
  case 'btsend':if(!st.ssid)return toast('Pick or type the Wi-Fi name first.');st.bt=2;draw();tmr=setTimeout(()=>{st.bt=3;draw()},1600);return;
  case 'btuse':{const b=st.bins[st.selSet];b.ip='192.168.1.'+(101+Math.min(st.selSet,2));st.link='live';draw();return toast('Address saved to '+b.name+'.');}
  case 'btoff':st.bt=4;draw();return toast('Bluetooth is off on the bin.');
  case 'simbin':st.selSim=+v;break;
  case 'simmode':{const b=st.bins[st.selSim];b.sim.mask^=(1<<+v);break;}
  case 'simtw':{const [k,val]=v.split(':');st.bins[st.selSim].sim.values[k]=+val;break;}
  case 'simstep':{const [k,dir]=v.split(':'),f=SIMF[k],sv=st.bins[st.selSim].sim.values;sv[k]=+clamp(sv[k]+f[1]*dir,f[2],f[3]).toFixed(1);break;}
  case 'apply':{const b=st.bins[st.selSim];return toast(b.sim.mask?'Simulation applied to '+b.name+'.':b.name+' is reading real sensors again.');}
  case 'simoff':st.bins[st.selSim].sim.mask=0;draw();return toast('All rows back to AUTO.');
  case 'markall':allAlerts(st).forEach(x=>st.readOver[x.id]=true);st.overlay='';draw();return toast('All alerts marked read.');
  case 'readtog':{const x=allAlerts(st).find(q=>String(q.id)===v);if(x)st.readOver[x.id]=!isRead(st,x);break;}
  case 'delalert':{const x=allAlerts(st).find(q=>String(q.id)===v);if(x)st.deleted[x.id]=1;break;}
  case 'clearask':st.overlay='clear';break;
  case 'clearyes':{const s=shownAlerts(st),t=scopeTxt(st,s.length);s.forEach(x=>st.deleted[x.id]=1);st.overlay='';draw();return toast('Deleted '+t+'.');}
  case 'fbshow':st.fbShow=!st.fbShow;break;
  case 'fbtest':case 'fbsave':{const e=fbCheck(st.fb);
    if(e){st.fbMsg=['bad',e+(a==='fbsave'?' Nothing was saved.':'')];break;}
    st.fbMsg=['ok','Signed in as '+esc(st.fb.email)+'. '+st.bins.length+' bin'+(st.bins.length>1?'s are':' is')+' on the allowed list.'+(a==='fbsave'?' Saved as the working set.':'')];
    if(a==='fbsave')FB_WORKING_SAVED=clone(st.fb);break;}
  case 'fbrestore':st.fb=clone(FB_WORKING_SAVED||FB_WORKING);st.fbMsg=['ok','Put back the last details that passed a test.'];break;
  case 'notifask':st.overlay='notifpre';break;
  case 'notifsys':st.overlay='notifsys';break;
  case 'allow':st.notif='granted';st.overlay='';draw();return toast('Push alerts are on.');
  case 'deny':st.notif='denied';st.overlay='';draw();return toast('Push alerts are off. You can change this in Settings.');
  case 'pickrole':if(v==='operator'){pinOpen(st,OP_PIN?'unlock':'set',true);break;}
    st.role=v;st.screen='overview';st.overlay='notifpre';break;
  case 'notcollect':{const b=st.bins[1]||st.bins[0];b.status='COLLECTING';st.screen='overview';st.overlay='';draw();return toast('Pickup started on '+b.name+'.');}
  case 'opennotif':st.screen='overview';st.overlay='';break;
  default:return;
  }
  draw();if(SL[idx].panel)sync();
}
$('#scale').addEventListener('pointerdown',()=>{if(cur&&cur.toast){cur.toast='';clearTimeout(toastT);const t=document.querySelector('#scale .toast');if(t)t.remove();}},true);
$('#scale').addEventListener('click',e=>{const g=e.target.closest('[data-a]');if(!g||g.disabled)return;e.stopPropagation();act(g.dataset.a,g.dataset.v)});
$('#scale').addEventListener('input',e=>{const t=e.target;
  if(t.dataset.in==='pickq'){const q=t.value.trim().toLowerCase();let n=0;document.querySelectorAll('#scale .pickopt').forEach(o=>{const hit=!q||o.dataset.q.includes(q);o.classList.toggle('hide',!hit);if(hit)n++});const e=document.querySelector('#pickNone');if(e)e.classList.toggle('hide',n>0);return}
  if(t.dataset.sv){const b=cur.bins[cur.selSim];b.sim.values[t.dataset.sv]=+t.value;const r=document.querySelector('[data-rv="'+t.dataset.sv+'"]');if(r)r.textContent=t.value;return}
  const k=t.dataset.in;if(!k)return;
  if(k==='collect_pin'&&cur.edit){t.value=t.value.replace(/\D/g,'').slice(0,4);cur.edit.collect_pin=+t.value||0;cur.dirty=true;}
  else if(k==='ssid'||k==='pass')cur[k]=t.value;
  else if(k==='bname')cur.bins[cur.sheetBin].name=t.value;
  else if(k==='bplace')cur.bins[cur.sheetBin].place=t.value;
  else if(k==='bip')cur.bins[cur.sheetBin].ip=t.value;
  else if(k.slice(0,3)==='fb.')cur.fb[k.slice(3)]=t.value;
});
$('#scale').addEventListener('change',e=>{const t=e.target;if(t.dataset.sv)draw();if(t.dataset.in==='collect_pin')draw()});

/* ---------- controls ---------- */
$('#dots').innerHTML=SL.map((s,k)=>'<i title="'+s.tag+' '+s.title+'" data-i="'+k+'"></i>').join('');
$('#dots').addEventListener('click',e=>{const d=e.target.closest('i');if(d)load(+d.dataset.i)});
$('#prev').onclick=()=>load(idx-1);$('#next').onclick=()=>load(idx+1);
$('#sysBtn').onclick=()=>{sysDark=!sysDark;$('#sysBtn').textContent='Phone: '+(sysDark?'dark':'light');draw()};
$('#devSel').onchange=e=>{dev=e.target.value;draw()};
$('#fzSel').onchange=e=>{fz=+e.target.value;draw()};
const ZL=[0,.75,1,1.25];$('#zoomBtn').onclick=()=>{zoom=ZL[(ZL.indexOf(zoom)+1)%ZL.length];$('#zoomBtn').textContent=zoom?'Zoom: '+zoom+'x':'Zoom: fit';draw()};
window.addEventListener('resize',draw);
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('#panel,.inp'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){load(idx+1);e.preventDefault()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){load(idx-1);e.preventDefault()}
  else if(e.key==='Home')load(0);else if(e.key==='End')load(SL.length-1);
  else if(e.key==='t'||e.key==='T'){sysDark=!sysDark;$('#sysBtn').textContent='Phone: '+(sysDark?'dark':'light');draw()}
});

/* ---------- sandbox panel: every value is held to what the sensors can report ---------- */
const RANGES={nb:[1,24],'b0.fill':[0,100],'b1.fill':[0,100],'b0.weight':[0,5000],'b0.temp':[-40,85],'b0.hum':[0,100],'b0.gas':[0,500],
  'b0.cal.fill_th':[10,100],'b0.cal.temp_th':[10,85],'b0.cal.hum_th':[30,100],'b0.cal.gas_th':[50,500],'b0.cal.weight_cap':[100,5000],unread:[0,9]};
Object.keys(RANGES).forEach(k=>{const el=document.querySelector('#pg [data-k="'+k+'"]');if(el){el.min=RANGES[k][0];el.max=RANGES[k][1]}});
function getK(k){
  if(k==='nb')return cur.bins.length;
  if(k==='simFill')return !!(cur.bins[0]&&cur.bins[0].sim.mask&1);
  const m=k.match(/^b(\d)\.(.+)$/);
  if(m){const b=cur.bins[+m[1]];if(!b)return '';if(m[2]==='lidOpen')return b.lid==='OPEN';return m[2].split('.').reduce((o,p)=>o[p],b);}
  return cur[k];
}
function setK(k,v){
  if(k==='nb'){const n=clamp(Math.round(v),1,24);while(cur.bins.length<n)cur.bins.push(binAt(cur.bins.length));cur.bins.length=n;cur.selSet=Math.min(cur.selSet,n-1);cur.selSim=Math.min(cur.selSim,n-1);cur.envBin=Math.min(cur.envBin,n-1);cur.chartBin='all';return}
  if(k==='simFill'){if(cur.bins[0])cur.bins[0].sim.mask=v?(cur.bins[0].sim.mask|1):(cur.bins[0].sim.mask&~1);return}
  if(k==='calib'){cur.calib=v;cur.selSet=0;cur.edit=v?clone(cur.bins[0].cal):null;if(!v)cur.dirty=false;if(v)cur.role='operator';return}
  if(k==='dirty'){cur.dirty=v;if(v&&!cur.calib){cur.calib=true;cur.selSet=0;cur.edit=clone(cur.bins[0].cal);cur.role='operator'}return}
  const m=k.match(/^b(\d)\.(.+)$/);
  if(m){const b=cur.bins[+m[1]];if(!b)return;if(m[2]==='lidOpen'){b.lid=v?'OPEN':'CLOSED';return}
    const p=m[2].split('.'),last=p.pop(),o=p.reduce((q,x)=>q[x],b);o[last]=v;
    if(/^cal\.(fill_th|temp_th|hum_th|gas_th|weight_cap)$/.test(m[2])){if(cur.edit&&+m[1]===cur.selSet)cur.edit[last]=v}
    return}
  cur[k]=v;
}
function sync(){
  document.querySelectorAll('#pg [data-k]').forEach(el=>{const v=getK(el.dataset.k);if(el.type==='checkbox')el.checked=!!v;else el.value=(v===undefined?'':v);el.disabled=v===''});
  $('#f0v').textContent=cur.bins[0]?cur.bins[0].fill+'%':'';$('#f1v').textContent=cur.bins[1]?cur.bins[1].fill+'%':'';
}
const clampK=(k,v)=>RANGES[k]?clamp(v,RANGES[k][0],RANGES[k][1]):v;
$('#pg').addEventListener('input',e=>{const el=e.target.closest('[data-k]');if(!el)return;const k=el.dataset.k;
  let v=el.type==='checkbox'?el.checked:(el.type==='number'||el.type==='range')?(el.value===''?NaN:+el.value):el.value;
  if(typeof v==='number'){if(!Number.isFinite(v))return;if(RANGES[k]&&v>RANGES[k][1]){v=RANGES[k][1];el.value=v}}
  setK(k,v);
  if(k==='fs'&&v&&!['charts'].includes(cur.screen))cur.screen='charts';
  draw();sync();});
$('#pg').addEventListener('change',e=>{const el=e.target.closest('[data-k]');if(!el||el.type!=='number')return;const k=el.dataset.k;
  const v=clampK(k,el.value===''?(RANGES[k]?RANGES[k][0]:0):+el.value);el.value=v;setK(k,v);draw();sync();});
const S0=()=>O(clone(SL[SL.length-1].st));
$('#simReset').onclick=()=>{cur=S0();sync();draw()};

const h0=location.hash.slice(1),k0=SL.findIndex(s=>s.id===h0);
load(k0>-1?k0:0);
