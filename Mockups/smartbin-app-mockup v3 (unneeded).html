<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart-Bin App Mockup v3</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#22201E;color:#EFE7DC;font-family:Inter,"Segoe UI",Arial,Helvetica,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:14px 12px 18px;gap:12px;
  -webkit-user-select:none;user-select:none}
body.wp{padding-right:12px}
.head{width:100%;max-width:760px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.head h1{margin:0;font-size:18px;font-weight:800}
.head .tag{display:inline-block;margin-right:8px;padding:2px 8px;border:2px solid #EFE7DC;font-size:12px;font-weight:800;letter-spacing:.6px}
.head p{margin:6px 0 0;font-size:13px;line-height:1.45;color:#BDB3A7;max-width:600px}
.count{font-size:13px;font-weight:800;color:#BDB3A7;white-space:nowrap;padding-top:3px}
.stage{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
.nav2{width:52px;height:52px;border:3px solid #EFE7DC;background:#2E2A27;color:#EFE7DC;box-shadow:4px 4px 0 #EFE7DC;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.nav2:active{transform:translate(4px,4px);box-shadow:0 0 0 #EFE7DC}
.nav2 svg{width:24px;height:24px}
.frame{background:#0B0A09;padding:10px;border-radius:44px;box-shadow:0 18px 40px rgba(0,0,0,.55);flex:none}
.view{position:relative;overflow:hidden;border-radius:34px}
.view .scale{position:absolute;left:0;top:0;transform-origin:0 0}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill2{border:2px solid #EFE7DC;background:#2E2A27;color:#EFE7DC;padding:7px 12px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.pill2:active{background:#3A3530}
.tools select{border:2px solid #EFE7DC;background:#2E2A27;color:#EFE7DC;padding:7px 8px;font:inherit;font-size:13px;font-weight:800}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:680px}
.dots i{width:11px;height:11px;border:2px solid #BDB3A7;cursor:pointer}
.dots i.on{background:#EFE7DC;border-color:#EFE7DC}
.hint2{font-size:12px;color:#8F867B;max-width:680px;text-align:center}
.panel{display:none;width:100%;max-width:880px;background:#2E2A27;border:3px solid #EFE7DC;box-shadow:4px 4px 0 #EFE7DC;padding:12px 14px;font-size:13px;-webkit-user-select:auto;user-select:auto}
.panel.on{display:block}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px}
.pg h3{grid-column:1/-1;margin:6px 0 0;font-size:12px;letter-spacing:.8px;color:#BDB3A7;border-bottom:2px solid #5a524a;padding-bottom:3px}
.pg label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.pg input[type=number],.pg select{width:96px;background:#1B1917;color:#EFE7DC;border:2px solid #EFE7DC;padding:4px 6px;font:inherit;font-weight:700;font-size:12px}
.pg select{width:130px}
.pg input[type=range]{width:100%}
.pg .full{flex-direction:column;align-items:stretch}
.pg input[type=checkbox]{width:18px;height:18px;accent-color:#EFE7DC}
@media (min-width:1250px){
 body.wp{padding-right:440px}
 .panel.on{position:fixed;right:12px;top:12px;width:410px;max-height:calc(100vh - 24px);overflow:auto}
 .panel .pg{grid-template-columns:1fr 1fr;gap:8px 14px}
 .panel .pg input[type=number]{width:62px}
 .panel .pg select{width:100px}
 .panel .pg label{font-size:12px}
}

/* ================= the phone screen: dashboard v9 tokens, sized for a phone ================= */
.ph{position:relative;overflow:hidden;font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  font-size:calc(14px*var(--fz,1));line-height:1.35;color:var(--ink);
  background:radial-gradient(130% 55% at 10% -6%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%),
    radial-gradient(110% 45% at 108% 6%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 72%),var(--tint);
  display:flex;flex-direction:column;transition:background .5s ease}
.ph[data-th="light"]{--base:#E4DCD2;--tint:#E4DCD2;--shL:#FFFBF5;--shD:#BEB2A4;--ink:#2A241E;--ink2:#7C7265;--well:#DED5CA;
  --ok:#1E8E3E;--warn:#D98A1F;--bad:#D93025;--sim:#7A45B5;--cal:#0D8A8A;--accent:#1E8E3E;--accentSoft:rgba(30,142,62,.22);--onAccent:#FFFFFF;
  --simSoft:rgba(122,69,181,.3);--calSoft:rgba(13,138,138,.3);
  --c-temp:#C2591B;--c-humid:#1F6FA8;--c-weight:#7A5A2E;--c-gas:#6B4FB8;--c-press:#B03A6F;
  --c-fill:#1E7A52;--c-bt:#1A62C4;--c-lid:#B07415;--c-motion:#0E7F9E;--c-link:#1E8E3E;--c-cloud:#D9631E;--c-tamper:#D93025;
  --lv-cool:#1F6FA8;--lv-low:#1E8E3E;--lv-mid:#B88410;--lv-high:#D9641F;--lv-crit:#D93025}
.ph[data-th="dark"]{--base:#2B2622;--tint:#2B2622;--shL:#3B342E;--shD:#1A1613;--ink:#EFE7DC;--ink2:#A2978B;--well:#262220;
  --ok:#4FBF6E;--warn:#E8A94A;--bad:#FF6B5E;--sim:#B98BE8;--cal:#3FC7C2;--accent:#4FBF6E;--accentSoft:rgba(79,191,110,.22);--onAccent:#13100D;
  --simSoft:rgba(185,139,232,.34);--calSoft:rgba(63,199,194,.32);
  --c-temp:#F0A368;--c-humid:#6CB8E8;--c-weight:#D6B98C;--c-gas:#B596F0;--c-press:#E58AB4;
  --c-fill:#4FC48D;--c-bt:#79AEF5;--c-lid:#E8B45C;--c-motion:#5FD0E8;--c-link:#4FBF6E;--c-cloud:#F29A5C;--c-tamper:#FF6B5E;
  --lv-cool:#6CB8E8;--lv-low:#4FBF6E;--lv-mid:#E8C45A;--lv-high:#F0A368;--lv-crit:#FF6B5E}
.ph{--accentBar:var(--accent);
  --o1:-4px -4px 9px var(--shL),4px 4px 9px var(--shD);
  --o2:-7px -7px 15px var(--shL),7px 7px 15px var(--shD);
  --i1:inset -4px -4px 8px var(--shL),inset 4px 4px 8px var(--shD);
  --i2:inset -6px -6px 12px var(--shL),inset 6px 6px 12px var(--shD)}
.ph[data-mode="sim"]{--accent:var(--sim);--accentSoft:rgba(122,69,181,.22);--tint:#E2DAE1}
.ph[data-mode="calib"]{--accent:var(--cal);--accentSoft:rgba(13,138,138,.2);--tint:#DBE3E0}
.ph[data-mode="dual"]{--accent:#43679F;--accentSoft:rgba(67,103,159,.24);--tint:#DEDDE6;--accentBar:linear-gradient(90deg,var(--sim) 0%,#43679F 50%,var(--cal) 100%)}
.ph[data-mode="alert"]{--accent:var(--bad);--accentSoft:rgba(217,48,37,.2);--tint:#EADCD5}
.ph[data-th="dark"][data-mode="sim"]{--accentSoft:rgba(185,139,232,.22);--tint:#2C2530}
.ph[data-th="dark"][data-mode="calib"]{--accentSoft:rgba(63,199,194,.2);--tint:#222B2A}
.ph[data-th="dark"][data-mode="dual"]{--accent:#7CA9D5;--accentSoft:rgba(124,169,213,.24);--tint:#262A33;--accentBar:linear-gradient(90deg,var(--sim) 0%,#7CA9D5 50%,var(--cal) 100%)}
.ph[data-th="dark"][data-mode="alert"]{--accentSoft:rgba(255,107,94,.2);--tint:#302422}
.ph *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:where(.ph) button,:where(.ph) input{font:inherit;color:inherit}
:where(.ph) button{cursor:pointer;background:none;border:0;padding:0}
.ph .ico{width:1.55em;height:1.55em;display:block;overflow:visible;flex:none}
.ph .ico.xs{width:1.15em;height:1.15em}
.ph .ico.lg{width:46px;height:46px}
.hide{display:none!important}
.sp{flex:1}

/* icon motion, same as the dashboard */
@media(prefers-reduced-motion:no-preference){
  .ph .wave{animation:drift 3.4s linear infinite}
  .ph .vap{animation:vrise 2.6s ease-in-out infinite}
  .ph .vap.v2{animation-delay:.5s}.ph .vap.v3{animation-delay:1s}
  .ph .pulse{animation:breathe 2.8s ease-in-out infinite;transform-origin:center}
  .ph .ring{animation:spin 2.4s linear infinite;transform-origin:12px 12px}
  .ph .shake{animation:shake .45s ease-in-out infinite}
  .ph .arcs>*{animation:sonar 1.6s ease-out infinite}
  .ph .arcs>:nth-child(2){animation-delay:.25s}.ph .arcs>:nth-child(3){animation-delay:.5s}
  .ph .wifi.live>*{animation:sonar 2.2s ease-out infinite}
  .ph .wifi.live>:nth-child(2){animation-delay:.3s}.ph .wifi.live>:nth-child(3){animation-delay:.6s}
  .ph .glowdot{animation:breathe 2s ease-in-out infinite}
  .ph .card.urgent{animation:haze 2.6s ease-in-out infinite}
  .ph .urgent .bar i:before{content:"";position:absolute;top:0;bottom:0;width:38%;border-radius:10px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sheen 2.1s ease-in-out infinite}
  .ph .sensor.alarm .halo{opacity:.38;animation:breathe 2.6s ease-in-out infinite}
  .ph .spinr{animation:spin 1.1s linear infinite}
}
@keyframes drift{to{transform:translateX(24px)}}
@keyframes vrise{0%{transform:translateY(2px);opacity:.25}50%{opacity:1}100%{transform:translateY(-4px);opacity:.2}}
@keyframes breathe{0%,100%{transform:scale(.82);opacity:.45}50%{transform:scale(1.12);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes sonar{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes haze{0%,100%{box-shadow:var(--o2),0 0 0 2px var(--accentSoft)}50%{box-shadow:var(--o2),0 0 0 7px var(--accentSoft)}}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sk{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph .lidflap{transform-origin:6px 9px;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.ph .open .lidflap{transform:rotate(-38deg)}
.ph .unlocked .shackle{transform:translateY(-3px)}
.ph .halo{opacity:0;transform-origin:12px 17.2px}

/* system bars */
.sbar{flex:none;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;font-weight:700;position:relative;z-index:30}
.sbar .cut{position:absolute;left:50%;top:6px;width:11px;height:11px;border-radius:50%;background:#000;transform:translateX(-50%)}
.sbar .si{display:flex;gap:5px;align-items:center}
.sbar .si svg{width:13px;height:13px}
.gest{flex:none;height:18px;display:flex;align-items:center;justify-content:center;background:var(--base)}
.gest i{width:110px;height:4px;border-radius:3px;background:var(--ink);opacity:.5}

/* header: brand, mode chip, theme, then the live strip, then the accent bar */
.apph{flex:none;display:flex;align-items:center;gap:8px;padding:4px 14px 4px}
.brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:1.12em;letter-spacing:.6px;white-space:nowrap;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis}
.ph.compact .modechip>span{display:none}
.ph.compact .modechip{padding:.62em .75em}
.ph.compact .linkc>span{display:none}
.brand .ico{color:var(--accent);width:1.45em;height:1.45em}
.modechip{display:flex;align-items:center;gap:6px;font-size:.74em;font-weight:800;letter-spacing:.6px;padding:.62em 1em;border-radius:999px;
  background:var(--accentBar);color:var(--onAccent);box-shadow:var(--o1);white-space:nowrap}
.modechip .ico{width:1.4em;height:1.4em}
.iconbtn{width:44px;height:44px;border-radius:13px;background:var(--base);box-shadow:var(--o1);display:grid;place-items:center;color:var(--accent);flex:none}
.iconbtn:active,.iconbtn[aria-pressed="true"]{box-shadow:var(--i1)}
.iconbtn .ico{width:21px;height:21px}
.sunmoon .sunside,.sunmoon .moonside{transition:opacity .45s ease}
.sunmoon.is-light .sunside{opacity:.3}.sunmoon.is-light .moonside{opacity:1}
.sunmoon.is-dark .moonside{opacity:.3}.sunmoon.is-dark .sunside{opacity:1}
.subh{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px;overflow-x:auto;scrollbar-width:none}
.subh::-webkit-scrollbar{display:none}
.statuspill{--cc:var(--warn);display:flex;align-items:center;gap:7px;padding:0 .95em;min-height:36px;border-radius:999px;font-size:.8em;font-weight:800;letter-spacing:.4px;
  color:var(--cc);background:var(--base);box-shadow:var(--o1),0 0 0 2px color-mix(in srgb,var(--cc) 34%,transparent);white-space:nowrap;flex:none}
.statuspill .ico{width:1.3em;height:1.3em;color:var(--cc)}
.linkc{display:flex;align-items:center;gap:7px;font-size:.8em;font-weight:700;padding:0 .95em;min-height:36px;border-radius:999px;background:var(--base);box-shadow:var(--o1);white-space:nowrap;flex:none}
.linkc .ico{color:var(--accent)}
.linkc.bad .ico{color:var(--bad)}
.rolec{font-size:.76em;font-weight:800;letter-spacing:.5px;padding:0 .95em;min-height:36px;border-radius:11px;background:var(--base);box-shadow:var(--o1);white-space:nowrap;flex:none}
.rolec:active{box-shadow:var(--i1)}
.abar{flex:none;height:3px;border-radius:3px;background:var(--accentBar);margin:4px 14px 0;opacity:.85}

.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 20px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.nm{background:var(--base);background-image:linear-gradient(160deg,color-mix(in srgb,var(--shL) 42%,transparent),transparent 58%);border-radius:18px;box-shadow:var(--o2)}
.pcard{padding:14px;display:flex;flex-direction:column;gap:12px;flex:none;position:relative}
.sechead{display:flex;align-items:center;gap:10px;min-height:40px;flex:none}
.sh{display:flex;align-items:center;gap:8px;margin:0;font-size:.76em;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:var(--cc,var(--ink2))}
.sh .ico{width:1.45em;height:1.45em;color:var(--cc,var(--ink2))}
.hint{font-size:.8em;color:var(--ink2);margin:0;line-height:1.45}
.hint b{color:var(--ink)}
.addmini{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:0 1em;min-height:40px;border-radius:999px;font-size:.86em;font-weight:700;color:var(--ink2);background:var(--base);box-shadow:var(--o1)}
.addmini .ico{width:1.2em;height:1.2em}
.addmini:active{box-shadow:var(--i1);color:var(--accent)}

/* buttons */
.btn{--cc:var(--ink2);background:var(--base);border-radius:13px;padding:.65em 1em;font-weight:700;letter-spacing:.3px;box-shadow:var(--o1);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;font-size:.88em;transition:box-shadow .15s,transform .15s;position:relative}
.btn:active{box-shadow:var(--i1);transform:translateY(1px)}
.btn .ico{width:1.3em;height:1.3em}
.btn.sm{min-height:38px;padding:.4em .85em;font-size:.8em;border-radius:11px}
.btn.block{width:100%}
.btn.tint,.btn.tint .ico{color:var(--cc)}
.btn.tint{box-shadow:var(--o1),0 0 0 2px color-mix(in srgb,var(--cc) 30%,transparent)}
.btn.tint:active{box-shadow:var(--i1),0 0 0 2px color-mix(in srgb,var(--cc) 30%,transparent)}
.btn.solid{background:var(--cc);color:var(--onAccent)}
.btn.solid .ico{color:var(--onAccent)}
.btn.accent{background:var(--accent);color:var(--onAccent)}
.btn.accent .ico{color:var(--onAccent)}
.btn.danger{color:#fff;background:var(--bad);border:2px solid var(--ink);border-radius:7px;box-shadow:4px 4px 0 var(--ink)}
.btn.danger .ico{color:#fff}
.btn.danger:active{box-shadow:1px 1px 0 var(--ink);transform:translate(3px,3px)}
.btn:disabled,.btn.tint:disabled,.btn.solid:disabled{color:var(--ink2);background:var(--base);box-shadow:var(--o1);opacity:.4;cursor:default;transform:none}
.btn:disabled .ico{color:var(--ink2)}
.segrow{display:flex;gap:9px;overflow-x:auto;padding:5px 5px 9px;margin:-5px -5px -4px;scrollbar-width:none;flex:none}
.segrow::-webkit-scrollbar{display:none}
.segrow .btn{flex:none;white-space:nowrap}
.binbtn .ico{width:1.2em;height:1.2em;color:var(--cc,var(--ink2))}
.binbtn[aria-pressed="true"]{color:var(--cc,var(--accent));box-shadow:var(--i1),0 0 0 2px color-mix(in srgb,var(--cc,var(--accent)) 30%,transparent)}
.binbtn[data-sim="1"]{box-shadow:var(--o1),0 0 0 2px var(--simSoft)}
.binbtn[data-sim="1"][aria-pressed="true"]{box-shadow:var(--i1),0 0 0 2px var(--simSoft)}
.tag{font-size:.7em;font-weight:800;letter-spacing:.5px;padding:.3em .7em;border-radius:6px;color:#fff;border:2px solid var(--ink);white-space:nowrap}

/* bin card */
.card{padding:14px;position:relative;flex:none}
.card.hot{box-shadow:var(--o2),0 0 0 2px var(--accentSoft)}
.card[data-bmode="sim"]:after,.card[data-bmode="dual"]:after,.card[data-bmode="cal"]:after{content:"";position:absolute;inset:-4px;border-radius:22px;pointer-events:none;border:3px solid var(--simSoft)}
.card[data-bmode="cal"]:after{border-color:var(--calSoft)}
.card[data-bmode="dual"]:before{content:"";position:absolute;inset:-9px;border-radius:27px;pointer-events:none;border:3px solid var(--calSoft)}
.cardtop{display:flex;gap:12px;align-items:flex-start}
.hero{width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--i1)}
.who{flex:1;min-width:0;padding-top:4px}
.binname{font-size:1.2em;font-weight:800;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.binplace{font-size:.86em;color:var(--ink2)}
.fillcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fillnum{font-size:2.45em;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.fillnum span{font-size:.42em}
.gearbtn{width:44px;height:44px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--base);box-shadow:var(--o1);color:var(--ink2)}
.gearbtn .ico{width:16px;height:16px}
.gearbtn em{font-style:normal;font-size:8px;font-weight:800;letter-spacing:.4px}
.gearbtn:active{box-shadow:var(--i1);color:var(--accent)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}
.chip{--cc:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 6px;border-radius:9px;
  font-size:.72em;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;background:var(--base);box-shadow:var(--o1);color:var(--ink2)}
.chip .ico{width:13px;height:13px}
.chip.on{color:var(--cc);box-shadow:var(--o1),0 0 0 2px color-mix(in srgb,var(--cc) 30%,transparent)}
.chip.on .ico{color:var(--cc)}
.chip.off{opacity:.38}
.bar{height:24px;margin:16px 0 6px;position:relative;overflow:hidden;border-radius:12px;background:var(--well);box-shadow:var(--i2)}
.bar i{position:absolute;top:3px;bottom:3px;left:3px;border-radius:10px;overflow:hidden;transition:width .6s ease}
.bar b{position:absolute;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--ink);opacity:.35}
.ticks{position:relative;height:1.3em;font-size:.76em;color:var(--ink2);font-weight:700}
.ticks span{position:absolute;top:0;transform:translateX(-50%)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.sensors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.sensor{--cc:var(--ink2);padding:10px 2px 8px;border-radius:13px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--well);box-shadow:var(--i1)}
.sensor .ico{color:var(--cc);width:1.5em;height:1.5em}
.sensor .v{font-size:1.04em;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--lvc,var(--ink));white-space:nowrap}
.sensor .k{font-size:.66em;font-weight:700;color:var(--ink2);letter-spacing:.2px;white-space:nowrap}
.sensor[data-s="temp"]{--cc:var(--c-temp)}.sensor[data-s="humid"]{--cc:var(--c-humid)}.sensor[data-s="weight"]{--cc:var(--c-weight)}.sensor[data-s="gas"]{--cc:var(--c-gas)}
.sensor[data-lv="cool"]{--lvc:var(--lv-cool)}.sensor[data-lv="low"]{--lvc:var(--lv-low)}.sensor[data-lv="mid"]{--lvc:var(--lv-mid)}.sensor[data-lv="high"]{--lvc:var(--lv-high)}
.sensor.alarm{background:var(--bad);box-shadow:3px 3px 0 var(--ink);border:2px solid var(--ink);border-radius:10px;--cc:#fff;--lvc:#fff}
.sensor.alarm .k{color:#fff}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.actions.two{grid-template-columns:repeat(2,1fr)}
.actions .btn{flex-direction:column;gap:3px;min-height:56px;font-size:.76em;padding:.45em .3em;line-height:1.1}
.actions .btn .ico{width:1.55em;height:1.55em}

/* priority and time to full */
.prio{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;background:var(--base);box-shadow:var(--o1)}
.prow .n{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.9em;font-weight:800;background:var(--well);box-shadow:var(--i1)}
.prow .nm2{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pc{font-weight:800;font-variant-numeric:tabular-nums}
.ttf{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;background:var(--base);box-shadow:var(--o1);border-left:5px solid var(--ink2)}
.ttf .ico{width:1.35em;height:1.35em}
.ttf[data-lv="near"]{border-left-color:var(--bad)}.ttf[data-lv="mid"]{border-left-color:var(--warn)}.ttf[data-lv="far"]{border-left-color:var(--ok)}
.ttf .nm2{flex:1;font-weight:700}
.ttf .when{font-variant-numeric:tabular-nums;font-weight:800}
.lvtag{font-size:.68em;font-weight:800;letter-spacing:.5px;padding:.35em .6em;border-radius:5px;color:#fff;min-width:52px;text-align:center;white-space:nowrap}

/* charts */
.chartwell{border-radius:14px;background:var(--well);box-shadow:var(--i1);overflow:hidden;position:relative;flex:none}
.chartwell svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:6px 14px;font-size:.76em;font-weight:700;flex-wrap:wrap;color:var(--ink2)}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend .now{font-weight:800;color:var(--ink)}
.cardbtn{margin-left:auto;width:40px;height:40px;border-radius:12px;background:var(--base);box-shadow:var(--o1);display:grid;place-items:center;color:var(--ink2)}
.cardbtn .ico{width:18px;height:18px}
.cardbtn:active{box-shadow:var(--i1);color:var(--accent)}

/* settings */
.calbar{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--well);box-shadow:var(--i1);flex:none}
.calbar.on{box-shadow:var(--i1),0 0 0 2px var(--accentSoft)}
.calico{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--base);box-shadow:var(--o1);color:var(--ink2)}
.calbar.on .calico{color:var(--accent)}
.caltxt{flex:1;min-width:0}
.caltxt b{display:block;font-size:.98em}
.caltxt span{font-size:.8em;color:var(--ink2);display:block;margin-top:2px}
.tgl{width:54px;height:32px;border-radius:16px;background:var(--well);box-shadow:var(--i1);position:relative;flex:none}
.tgl i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--base);box-shadow:var(--o1);transition:transform .22s cubic-bezier(.3,1.3,.5,1)}
.tgl[aria-checked="true"]{background:var(--accent);box-shadow:var(--i1)}
.tgl[aria-checked="true"] i{transform:translateX(22px)}
.tglrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--base);box-shadow:var(--o1)}
.tglrow span{flex:1;font-weight:700;font-size:.9em}
.calbar.on .tglrow span{color:var(--accent)}
.sect{--cc:var(--ink2);border-radius:16px;background:var(--base);box-shadow:var(--o1);flex:none}
.sect[data-sec="range"]{--cc:var(--cal)}.sect[data-sec="limits"]{--cc:var(--bad)}.sect[data-sec="air"]{--cc:var(--c-gas)}
.sect[data-sec="lid"]{--cc:var(--sim)}.sect[data-sec="weight"]{--cc:var(--c-weight)}
.secth{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 14px;text-align:left}
.secth .st{font-size:.76em;letter-spacing:1.2px;font-weight:800;text-transform:uppercase;color:var(--cc);display:flex;align-items:center;gap:10px;white-space:nowrap}
.secth .st:before{content:"";width:4px;height:15px;border-radius:2px;background:var(--cc)}
.secth .sum{flex:1;text-align:right;font-size:.76em;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secth .chev{width:18px;height:18px;color:var(--ink2);transition:transform .25s}
.sect.open .secth .chev{transform:rotate(180deg)}
.sectb{padding:2px 14px 16px;display:flex;flex-direction:column;gap:14px}
.sectb.locked{opacity:.5;filter:saturate(.4)}
.sectb.locked .step,.sectb.locked .btn,.sectb.locked .tgl,.sectb.locked .inp{pointer-events:none}
.field label{display:flex;align-items:center;gap:6px;font-size:.76em;font-weight:800;letter-spacing:.4px;color:var(--cc,var(--ink2));margin-bottom:7px}
.field label .ico{width:15px;height:15px;color:var(--cc,var(--ink2))}
.well{display:flex;align-items:center;gap:6px;background:var(--well);border-radius:13px;box-shadow:var(--i1);padding:4px}
.well .num{flex:1;text-align:center;font-size:1.25em;font-weight:800;font-variant-numeric:tabular-nums}
.well .u{font-size:.76em;font-weight:800;color:var(--ink2);margin-right:2px}
.step{width:44px;height:44px;border-radius:11px;background:var(--base);box-shadow:var(--o1);font-weight:800;font-size:1.3em;color:var(--ink2);flex:none;line-height:1}
.step:active{box-shadow:var(--i1);color:var(--cc,var(--accent))}
.withbtn{display:flex;gap:8px;align-items:center}
.withbtn .well,.withbtn .inp{flex:1;min-width:0}
.withbtn .btn{flex:none;white-space:nowrap}
.readout{padding:.8em 1em;font-weight:800;border-radius:12px;background:var(--well);box-shadow:var(--i1);font-variant-numeric:tabular-nums}
.inp{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--well);box-shadow:var(--i1);padding:0 13px;font-size:1.02em;font-weight:700;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{box-shadow:var(--i1),0 0 0 2px var(--accentSoft)}
.inp:disabled{opacity:.5}
.savebar{position:sticky;bottom:-8px;z-index:6;display:flex;align-items:center;gap:8px;padding:10px;border-radius:16px;background:var(--base);
  box-shadow:var(--o2),0 0 0 2px var(--accentSoft);flex:none}
.savebar .dt{flex:1;font-size:.8em;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px}
.savebar .dt .ico{width:1.3em;height:1.3em}
.pincard{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border-radius:16px;background:var(--well);box-shadow:var(--i1);flex:none}
.pinico{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--base);box-shadow:var(--o1);color:var(--cal)}
.pintxt{flex:1;min-width:170px}
.pintxt b{display:block;font-size:.98em}
.pintxt span{font-size:.8em;color:var(--ink2)}
.pinval{font-size:2em;font-weight:800;letter-spacing:6px;line-height:1.1;color:var(--cal);font-variant-numeric:tabular-nums;flex:1}
.pinval.masked{letter-spacing:4px}
.lrow{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 13px;border-radius:14px;background:var(--base);box-shadow:var(--o1);flex:none;width:100%;text-align:left}
.lrow>.ico{color:var(--cc,var(--ink2));width:1.45em;height:1.45em}
.lrow .lt{flex:1;font-weight:700;min-width:0}
.lrow .ls{display:block;font-size:.8em;color:var(--ink2);font-weight:600;margin-top:1px}
.lrow .go{width:18px;height:18px;color:var(--ink2);transform:rotate(-90deg)}
button.lrow:active{box-shadow:var(--i1)}
.twoway{display:inline-flex;gap:5px;padding:5px;border-radius:13px;background:var(--well);box-shadow:var(--i1)}
.tw{--cc:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 .8em;min-height:38px;border-radius:9px;font-size:.78em;font-weight:700;color:var(--ink2);transition:background .25s,color .25s}
.tw .ico{width:1.25em;height:1.25em}
.tw[aria-pressed="true"]{background:var(--cc);color:var(--onAccent);box-shadow:var(--o1)}
.tw[aria-pressed="true"] .ico{color:var(--onAccent)}
.tw:disabled{opacity:.42;cursor:default}
.twoway.full{display:flex}.twoway.full .tw{flex:1}

/* bluetooth */
.backbar{display:flex;align-items:center;gap:10px;flex:none}
.backbar h2{margin:0;font-size:1.12em;font-weight:800;flex:1}
.btstate{display:flex;align-items:center;gap:7px;font-size:.76em;font-weight:800;letter-spacing:.4px;padding:0 .9em;min-height:34px;border-radius:999px;color:var(--ink2);background:var(--base);box-shadow:var(--o1);white-space:nowrap}
.btstate .ico{width:1.3em;height:1.3em}
.btstate[data-on="1"]{color:var(--c-bt);box-shadow:var(--o1),0 0 0 2px color-mix(in srgb,var(--c-bt) 32%,transparent)}
.btsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btstep{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:11px 4px;border-radius:13px;background:var(--well);box-shadow:var(--i1);color:var(--ink2)}
.btstep .ico{width:19px;height:19px}
.btstep b{font-size:.64em;font-weight:800;letter-spacing:.3px;line-height:1.2}
.btstep.on{color:var(--c-bt);background:var(--base);box-shadow:var(--o1),0 0 0 2px color-mix(in srgb,var(--c-bt) 30%,transparent)}
.btstep.done{color:var(--ok)}
.btresult{padding:14px;border-radius:14px;background:var(--well);box-shadow:var(--i1);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btresult .ip{font-weight:800;font-size:1.3em;font-variant-numeric:tabular-nums;color:var(--ok)}
.btresult>.ico{color:var(--ok)}

/* simulation */
.simrow{--cc:var(--ink2);border-radius:16px;background:var(--base);box-shadow:var(--o1);padding:12px 13px;display:flex;flex-direction:column;gap:10px;flex:none}
.simrow[data-manual="1"]{box-shadow:var(--o1),inset 4px 0 0 var(--cc)}
.simtop{display:flex;align-items:center;gap:10px}
.simname{flex:1;display:flex;align-items:center;gap:10px;font-weight:700}
.simname .ico{color:var(--cc)}
.modebtn{min-width:104px}
.modebtn[data-mode="AUTO"]{--cc:var(--ok)}
.modebtn[data-mode="MANUAL"]{background:var(--sim);color:#fff;box-shadow:var(--o1)}
.modebtn[data-mode="MANUAL"] .ico{color:#fff}
.simval{display:flex;align-items:center;gap:10px}
.simval.off{opacity:.45}
.simval.off *{pointer-events:none}
.simval input[type=range]{flex:1;accent-color:var(--sim);height:28px;margin:0}
.simval .rv{min-width:66px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;padding:.55em .7em;border-radius:11px;background:var(--well);box-shadow:var(--i1)}
.simval .rv small{font-size:.7em;color:var(--ink2);margin-left:3px}
.simval .well{flex:1}
.simval.col{flex-direction:column;align-items:stretch}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:11px}
.alert{--cc:var(--ink2);display:flex;gap:10px;align-items:center;padding:11px 10px 11px 8px;border-radius:14px;background:var(--base);box-shadow:var(--o1);border-left:5px solid var(--ink2);flex:none}
.alert[data-lv="warning"]{border-left-color:var(--warn)}.alert[data-lv="info"]{border-left-color:var(--sim)}.alert[data-lv="success"]{border-left-color:var(--ok)}
.alert[data-lv="critical"]{background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink)}
.alert .av{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--well);box-shadow:var(--i1)}
.alert .av .ico{width:1.4em;height:1.4em}
.alert[data-lv="critical"] .av{background:rgba(255,255,255,.17);box-shadow:none;color:#fff}
.alert .ttl{font-weight:800;font-size:.95em;display:block}
.alert .meta{font-size:.78em;color:var(--ink2);margin-top:2px}
.alert[data-lv="critical"] .meta{color:rgba(255,255,255,.88)}
.alert .lvtag{display:none}
.alert[data-lv="critical"] .lvtag{background:rgba(0,0,0,.28)}
.alert .rd{width:30px;height:44px;flex:none;display:grid;place-items:center;color:var(--cc)}
.alert .rd i{width:11px;height:11px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 24%,transparent)}
.alert[data-read="1"] .rd i{background:transparent;box-shadow:inset 0 0 0 2px currentColor;opacity:.5}
.alert[data-read="1"]{opacity:.66}
.alert[data-read="1"] .ttl{font-weight:700}
.alert[data-lv="critical"] .rd{color:#fff}
.alert .del{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--ink2);background:var(--base);box-shadow:var(--o1)}
.alert .del .ico{width:15px;height:15px}
.alert[data-lv="critical"] .del{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.unreadpip{font-style:normal;font-size:.68em;font-weight:800;letter-spacing:.5px;padding:.35em .6em;border-radius:5px;background:var(--c-tamper);color:#fff;letter-spacing:.5px}
.empty{padding:30px 14px;text-align:center;color:var(--ink2);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:.92em}
.empty .ico{width:34px;height:34px;opacity:.55}

/* brutal banners and sheets */
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:2px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);font-weight:700;color:#fff;font-size:.88em;flex:none}
.banner .ico{color:#fff;width:1.45em;height:1.45em;margin-top:-1px}
.banner .bt{flex:1;min-width:0}
.banner small{display:block;font-weight:600;opacity:.92;font-size:.9em;margin-top:2px}
.banner.red{background:var(--bad)}.banner.purple{background:var(--sim)}.banner.teal{background:var(--cal)}.banner.green{background:var(--ok)}
.banner.amber{background:var(--warn);color:#241C10}.banner.amber .ico{color:#241C10}
.ph[data-th="dark"] .banner{color:#13100D}.ph[data-th="dark"] .banner .ico{color:#13100D}
.popsec{font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink2);padding:4px 2px 0}
.popact{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 4px 8px}
.popact .btn.tint{box-shadow:3px 3px 8px var(--shD),-3px -3px 8px var(--shL),0 0 0 2px color-mix(in srgb,var(--cc) 30%,transparent)}
.scrim{position:absolute;inset:0;background:rgba(10,8,6,.5);z-index:40;animation:fade .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--base);border-radius:24px 24px 0 0;max-height:82%;overflow-y:auto;scrollbar-width:none;
  padding:8px 16px 26px;display:flex;flex-direction:column;gap:12px;animation:up .24s ease;box-shadow:0 -12px 30px rgba(0,0,0,.28)}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--ink2);opacity:.4;align-self:center;flex:none}
.sheet h3{margin:0;font-size:1.1em;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet h3 .ico{color:var(--accent)}
.sheet p{margin:0;font-size:.9em}
.acts{display:flex;gap:10px}
.acts .btn{flex:1}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;font-weight:700;padding:0 12px;border-radius:13px;background:var(--base);box-shadow:var(--o1)}
.opt .rad{width:22px;height:22px;border-radius:50%;background:var(--well);box-shadow:var(--i1);display:grid;place-items:center;flex:none}
.opt.on{color:var(--accent);box-shadow:var(--i1)}
.opt.on .rad:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.opt .ls{margin-left:auto;font-size:.8em;color:var(--ink2);font-weight:700}
.picker{display:flex;align-items:center;gap:8px;padding:5px;border-radius:999px;background:var(--well);box-shadow:var(--i1);align-self:center}
.picker button{width:44px;height:44px;border-radius:50%;font-weight:800;font-size:1.3em;color:var(--ink2);background:var(--base);box-shadow:var(--o1)}
.picker button:disabled{opacity:.35}
.picker span{min-width:40px;text-align:center;font-weight:800;font-size:1.4em;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:14px;right:14px;bottom:92px;z-index:60;animation:rise .25s;pointer-events:none}
/* v3: the PIN and pairing-code keypad */
.pico{display:flex;justify-content:center;color:var(--accent)}
.pico .ico{width:38px;height:38px}
.pdots{display:flex;justify-content:center;gap:10px;margin:6px 0 2px}
.pdots i{width:14px;height:14px;border-radius:50%;background:var(--well);box-shadow:var(--i1)}
.pdots i.on{background:var(--accent);box-shadow:none}
.pmsg{min-height:1.2em;text-align:center;font-weight:800;font-size:.82em}
.pmsg.bad{color:var(--bad)}.pmsg.ok{color:var(--ok)}
.pkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pkeys .btn{min-height:54px;font-size:1.35em;font-variant-numeric:tabular-nums;justify-content:center}
.pkeys .btn.go{font-size:.86em;letter-spacing:.6px;color:var(--accent)}
.binscr{background:#14181C;border-radius:14px;padding:12px 10px;text-align:center;color:#fff}
.binscr small{display:block;font-size:.6em;letter-spacing:.08em;color:#8A96A3;font-weight:700}
.binscr .pc{display:block;color:#5FD0E8;font-size:.72em;letter-spacing:.12em;font-weight:800;margin-top:3px}
.binscr b{display:block;font-size:2.1em;letter-spacing:.08em;font-variant-numeric:tabular-nums;line-height:1.25}
.sk{background:var(--well);box-shadow:var(--i1);border-radius:18px;animation:sk 1.2s ease-in-out infinite;flex:none}

/* bottom nav */
.bnav{flex:none;display:flex;gap:5px;padding:8px 8px 4px;background:var(--base);box-shadow:0 -10px 20px -14px var(--shD);position:relative;z-index:5}
.bn{--cc:var(--ink2);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border-radius:14px;color:var(--ink2);font-weight:700;font-size:calc(9.8px*min(var(--fz,1),1.1));letter-spacing:-.1px;position:relative;min-width:0}
.bn .ico{width:calc(22px*var(--fz,1));height:calc(22px*var(--fz,1))}
.bn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bn[aria-selected="true"]{color:var(--cc);box-shadow:var(--i1),0 0 0 2px color-mix(in srgb,var(--cc) 26%,transparent)}
.badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:20px;height:20px;border-radius:6px;background:var(--c-tamper);color:#fff;border:2px solid var(--ink);
  box-shadow:2px 2px 0 var(--ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* first launch */
.gatehero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0 4px;text-align:center}
.gatehero .hero{width:104px;height:104px}
.gatehero .hero .ico.lg{width:76px;height:76px}
.gatehero h1{margin:0;font-size:1.65em;letter-spacing:.4px}
.role{display:flex;gap:13px;align-items:flex-start;padding:16px;text-align:left;border-radius:18px;background:var(--base);box-shadow:var(--o1);width:100%}
.role:active{box-shadow:var(--i1),0 0 0 2px var(--accentSoft)}
.role>.ico{color:var(--accent);width:34px;height:34px}
.role h3{margin:0 0 6px;font-size:1.05em}
.role ul{margin:0;padding-left:18px;font-size:.84em;color:var(--ink2);line-height:1.6}

/* phone system surfaces */
.sysdlg{position:absolute;left:24px;right:24px;top:30%;z-index:41;background:#F2EEF5;color:#1b1b1f;border-radius:28px;padding:22px 20px 16px;font-family:Roboto,Arial,sans-serif;animation:fade .2s}
.sysdlg h4{margin:8px 0 6px;font-size:1.15em;text-align:center;font-weight:500}
.sysdlg .ic{width:34px;height:34px;margin:0 auto;color:#555}
.sysdlg button{display:block;width:100%;min-height:48px;border:0;border-radius:24px;background:#E4DEEA;margin-top:8px;font-size:1em;font-weight:500;color:#2b2b6e;cursor:pointer}
.appicon{width:18px;height:18px;border-radius:5px;background:#1E8E3E;color:#fff;display:grid;place-items:center;flex:none}
.appicon svg{width:13px;height:13px}
.hup{position:absolute;left:8px;right:8px;top:30px;z-index:70;background:#fff;color:#1b1b1f;border-radius:22px;padding:10px 12px;font-family:Roboto,Arial,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:rise .25s}
.ph[data-th="dark"] .hup{background:#2d2a2f;color:#eee}
.hup .top,.nc .top{display:flex;align-items:center;gap:7px;font-size:.78em;opacity:.85}
.hup .ti,.nc .ti{font-weight:700;font-size:.98em;margin-top:5px}
.hup .tx,.nc .tx{font-size:.88em;opacity:.85;margin-top:2px}
.hup .ac,.nc .ac{display:flex;gap:8px;margin-top:9px}
.hup .ac span{flex:1;text-align:center;padding:9px 6px;border-radius:18px;background:rgba(128,128,128,.18);font-weight:700;font-size:.85em;cursor:pointer}
.lock{flex:1;display:flex;flex-direction:column;background:linear-gradient(160deg,#41513f,#1d2a22 55%,#2b2433);color:#fff;font-family:Roboto,Arial,sans-serif}
.lock .clock{text-align:center;margin-top:34px}
.lock .clock b{font-size:4.2em;font-weight:300;letter-spacing:-.02em;display:block;line-height:1}
.lock .clock span{font-size:.95em;opacity:.85}
.lock .nl{margin:22px 12px 0;display:flex;flex-direction:column;gap:6px}
.nc{background:rgba(255,255,255,.9);color:#1b1b1f;border-radius:20px;padding:11px 13px;cursor:pointer}
.nc .ac span{flex:1;text-align:center;padding:9px 6px;border-radius:18px;background:rgba(0,0,0,.08);font-weight:700;font-size:.85em;cursor:pointer}
.lock .ls{margin-top:auto;display:flex;justify-content:space-between;padding:0 30px 14px;opacity:.9}
.lock .ls svg{width:22px;height:22px}
.lock .gest{background:transparent}

/* landscape chart */
.fsw{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 12px 8px}
.fst{flex:none;display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border-radius:14px;background:var(--base);box-shadow:var(--o1)}
.fst .segrow{flex:1;margin:0;padding:4px}
.fstage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}

/* many bins: grid tiles, merged priority list, bin picker */
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;flex:none}
.ph.compact .bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.btile{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px 9px;border-radius:16px;background:var(--base);box-shadow:var(--o1);text-align:center;min-width:0}
.btile:active{box-shadow:var(--i1)}
.btile .ico.lg{width:42px;height:42px}
.btile .tn{font-weight:800;font-size:.84em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btile .tp{font-size:1.22em;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.btile .tf{display:flex;gap:4px;justify-content:center;min-height:15px}
.btile .tf .ico{width:15px;height:15px}
.btile[data-bmode="sim"]{background:color-mix(in srgb,var(--sim) 18%,var(--base))}
.btile[data-bmode="cal"]{background:color-mix(in srgb,var(--cal) 18%,var(--base))}
.btile[data-bmode="dual"]{background:linear-gradient(135deg,color-mix(in srgb,var(--sim) 22%,var(--base)) 50%,color-mix(in srgb,var(--cal) 22%,var(--base)) 50%)}
.btile.urgent{box-shadow:var(--o1),0 0 0 2.5px var(--bad)}
@media(prefers-reduced-motion:no-preference){.ph .btile.urgent{animation:thaze 2.2s ease-in-out infinite}}
@keyframes thaze{0%,100%{box-shadow:var(--o1),0 0 0 2.5px var(--bad)}50%{box-shadow:var(--o1),0 0 0 5px color-mix(in srgb,var(--bad) 45%,transparent)}}
.adot{position:absolute;top:6px;right:6px;width:19px;height:19px;border-radius:5px;background:var(--bad);color:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-size:11px;font-weight:900;display:grid;place-items:center;line-height:1;font-style:normal}
.adot.inl{position:static;display:inline-grid;width:16px;height:16px;font-size:10px;margin-right:5px;vertical-align:-3px}
.tlegend{display:flex;flex-wrap:wrap;gap:7px 13px;font-size:.72em;font-weight:700;color:var(--ink2);align-items:center;flex:none}
.tlegend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:5px}
.vtog .tw{min-height:36px;padding:0 .55em}
.vtog .tw span:empty{display:none}
.addmini span{white-space:nowrap}
button.prow{width:100%;text-align:left}
.prow .nm2 small{display:flex;align-items:center;gap:4px;font-size:.76em;color:var(--ink2);font-weight:600;margin-top:2px}
.prow .nm2 small .ico{width:12px;height:12px}
.ttfrow{border-left:5px solid var(--ink2)}
.ttfrow[data-lv="near"]{border-left-color:var(--bad)}.ttfrow[data-lv="mid"]{border-left-color:var(--warn)}.ttfrow[data-lv="far"]{border-left-color:var(--ok)}
.pickbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:6px 12px 6px 8px;border-radius:14px;background:var(--base);box-shadow:var(--o1),0 0 0 2px var(--accentSoft);text-align:left;flex:none}
.pickbtn:active{box-shadow:var(--i1)}
.pickbtn:disabled{opacity:.6;cursor:default}
.pickbtn .ico.lg,.pickopt .ico.lg{width:34px;height:34px}
.pkall{width:34px;height:34px;display:grid;place-items:center;color:var(--ink2);flex:none}
.pickbtn .pt,.pickopt .pt{flex:1;min-width:0}
.pickbtn .pt b,.pickopt .pt b{display:block;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn .pt small,.pickopt .pt small{display:block;font-size:.76em;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn .pc{font-size:.72em;font-weight:800;color:var(--ink2);white-space:nowrap;text-align:right}
.pickbtn .chev{width:18px;height:18px;color:var(--ink2)}
.picklist{display:flex;flex-direction:column;gap:9px}
.pickopt{gap:10px;min-height:58px}
.pickopt .ls{font-weight:800;font-size:.9em}
.mtag{font-size:.6em;font-weight:800;letter-spacing:.4px;padding:.3em .5em;border-radius:5px;color:#fff;flex:none}
.hctx{margin-left:auto;font-size:.68em;font-weight:700;color:var(--ink2)}
.sheetnav{display:flex;align-items:center;gap:8px;flex:none}
.sheetnav .snt{flex:1;text-align:center;min-width:0}
.snt b{display:block;font-size:1.02em}
.snt small{color:var(--ink2);font-size:.74em;font-weight:700}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn.flip .ico{transform:rotate(180deg)}
.iconbtn .ico{color:inherit}
.binsheet .card{box-shadow:var(--o1)}
.envseg .tw{flex-direction:column;gap:2px;min-height:52px;padding:5px 2px;font-size:.62em;letter-spacing:.2px}
.envseg .tw .ico{width:2em;height:2em}
.fsttl{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 8px;border-radius:12px;flex:none}
.fsttl:active{box-shadow:var(--i1)}
.fsttl .fsb{display:flex;align-items:center;gap:4px;font-weight:800;font-size:.86em;white-space:nowrap}
.fsttl .fsb .ico{width:16px;height:16px;color:var(--ink2)}
.fsctl{flex:1;min-width:0}
/* v2: full sensor names. The label shrinks only when its tile is too narrow for it (large font sizes), so the tiles keep their size. */
.sensor{container-type:inline-size}
.sensor .k{font-size:min(.66em,14cqi)}
.envseg .tw[data-v="both"]{flex:.75}
.envseg .tw{container-type:inline-size}
.envseg .tw b{font:inherit;white-space:nowrap;font-size:min(1em,calc(100cqi / var(--r,6)))}
/* v2: cloud link (Firebase), stale bins */
.linkc{cursor:pointer}
.linkc.cloud{color:var(--c-cloud)}.linkc.cloud .ico{color:var(--c-cloud)}
.banner.orange{background:var(--c-cloud)}
.card.stale .sensors,.card.stale .bar,.card.stale .ticks,.card.stale .fillnum{opacity:.42;filter:grayscale(.6)}
.lastseen{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:.74em;font-weight:800;color:var(--bad)}
.lastseen .ico{width:13px;height:13px}
.btile.stale{opacity:.5}
/* v2: connection page */
.route{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;background:var(--well);box-shadow:var(--i1);flex:none}
.route.on{background:var(--base);box-shadow:var(--o1),0 0 0 2px color-mix(in srgb,var(--cc) 34%,transparent)}
.route .rn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8em;background:var(--base);box-shadow:var(--o1);color:var(--cc);flex:none}
.route>.ico{color:var(--cc);width:1.45em;height:1.45em;flex:none}
.route .rt{flex:1;min-width:0;font-weight:800;font-size:.92em}
.route .rt small{display:block;font-weight:600;font-size:.84em;color:var(--ink2);margin-top:2px;line-height:1.35}
.addrs{display:flex;flex-direction:column;gap:7px}
.addr{display:flex;align-items:center;gap:9px;font-size:.84em;font-weight:700}
.addr .dot{width:10px;height:10px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 22%,transparent);flex:none}
.addr .an{flex:1;min-width:0}
.addr .an small{color:var(--ink2);font-weight:600;margin-left:6px}
.addr .as{font-size:.86em;color:var(--cc);white-space:nowrap}
.fbmsg{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:.82em;font-weight:700;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);color:#fff;flex:none}
.fbmsg .ico{width:1.3em;height:1.3em;color:#fff;flex:none}
.fbmsg.ok{background:var(--ok)}.fbmsg.bad{background:var(--bad)}
.ph[data-th="dark"] .fbmsg,.ph[data-th="dark"] .fbmsg .ico{color:#13100D}
.usebar{height:14px;border-radius:7px;background:var(--well);box-shadow:var(--i1);overflow:hidden;flex:none}
.usebar i{display:block;height:100%;border-radius:7px;background:var(--c-cloud)}
/* v2: alert history tools */
.akind .tw{padding:0;min-height:40px}
.akind .tw span:empty{display:none}
.arange .tw{min-height:36px;padding:0 .4em}
.scope{font-size:.82em;font-weight:800;color:var(--ink);margin:0}
.scope small{display:block;font-weight:600;color:var(--ink2);margin-top:2px}
</style>
</head>
<body>
<div class="head">
  <div>
    <h1><span class="tag" id="tag">APP</span><span id="title">Title</span></h1>
    <p id="note"></p>
  </div>
  <div class="count" id="count">1 / 1</div>
</div>

<div class="stage">
  <button class="nav2" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="square"><path d="M15 4L7 12l8 8"/></svg></button>
  <div class="frame"><div class="view" id="view"><div class="scale" id="scale"></div></div></div>
  <button class="nav2" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="square"><path d="M9 4l8 8-8 8"/></svg></button>
</div>

<div class="tools">
  <button class="pill2" id="sysBtn">Phone: light</button>
  <select id="devSel" aria-label="Device">
    <option value="s23u">Galaxy S23 Ultra (about 384 dp)</option>
    <option value="a56">Galaxy A56 (about 411 dp)</option>
    <option value="small">Small phone (360 dp)</option>
  </select>
  <select id="fzSel" aria-label="Font size">
    <option value="1">Font 100%</option><option value="1.15">Font 115%</option><option value="1.3">Font 130% (largest)</option>
  </select>
  <button class="pill2" id="zoomBtn">Zoom: fit</button>
</div>
<div class="dots" id="dots"></div>
<div class="hint2">Left and right arrow keys change the screen. T switches the phone between light and dark. Everything on the phone screen can be tapped. The last slide is a live sandbox.</div>

<div class="panel" id="panel"><div class="pg" id="pg">
  <h3>SCREEN</h3>
  <label>Tab<select data-k="screen"><option value="overview">Overview</option><option value="charts">Charts</option><option value="settings">Settings</option><option value="sim">Simulation</option><option value="alerts">Alerts</option><option value="bt">Bluetooth setup</option><option value="net">Connection</option><option value="gate">First launch</option><option value="lock">Lock screen</option></select></label>
  <label>Overlay<select data-k="overlay"><option value="">None</option><option value="alerts">Needs attention sheet</option><option value="binedit">Bin settings sheet</option><option value="addbin">Add bins sheet</option><option value="clear">Clear alerts sheet</option><option value="wifi">Wi-Fi list sheet</option><option value="notifpre">Alerts prompt</option><option value="notifsys">Android permission</option><option value="headsup">Heads-up banner</option></select></label>
  <label>Role<select data-k="role"><option value="operator">Operator</option><option value="collector">Collector</option></select></label>
  <label>App theme<select data-k="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label>Landscape chart<input type="checkbox" data-k="fs"></label>
  <label>Loading<input type="checkbox" data-k="loading"></label>
  <h3>BINS</h3>
  <label>Bins (1 to 24)<input type="number" step="1" data-k="nb"></label>
  <label>Connection<select data-k="link"><option value="demo">Demo data</option><option value="live">Local Wi-Fi</option><option value="cloud">Cloud (Firebase)</option><option value="offline">Nothing answering</option></select></label>
  <label class="full">Bin 01 fill <span id="f0v"></span><input type="range" step="1" data-k="b0.fill"></label>
  <label>Bin 01 weight g<input type="number" step="50" data-k="b0.weight"></label>
  <label>Bin 01 temp C<input type="number" step="0.5" data-k="b0.temp"></label>
  <label>Bin 01 humidity %<input type="number" step="1" data-k="b0.hum"></label>
  <label>Bin 01 air IAQ<input type="number" step="5" data-k="b0.gas"></label>
  <label>Bin 01 status<select data-k="b0.status"><option value="OK">OK</option><option value="LOCKED">Locked</option><option value="TAMPER">Tamper</option><option value="COLLECTING">Collecting</option></select></label>
  <label>Bin 01 lid open<input type="checkbox" data-k="b0.lidOpen"></label>
  <label>Bin 01 motion<input type="checkbox" data-k="b0.motion"></label>
  <label class="full">Bin 02 fill <span id="f1v"></span><input type="range" step="1" data-k="b1.fill"></label>
  <label>Bin 02 not answering<input type="checkbox" data-k="b1.off"></label>
  <label>Bin 02 status<select data-k="b1.status"><option value="OK">OK</option><option value="LOCKED">Locked</option><option value="TAMPER">Tamper</option><option value="COLLECTING">Collecting</option></select></label>
  <h3>BIN 01 LIMITS</h3>
  <label>Fill limit %<input type="number" step="1" data-k="b0.cal.fill_th"></label>
  <label>Temp limit C<input type="number" step="1" data-k="b0.cal.temp_th"></label>
  <label>Humidity limit %<input type="number" step="1" data-k="b0.cal.hum_th"></label>
  <label>Air limit IAQ<input type="number" step="5" data-k="b0.cal.gas_th"></label>
  <label>Weight capacity g<input type="number" step="50" data-k="b0.cal.weight_cap"></label>
  <h3>MODES AND ALERTS</h3>
  <label>Calibration (Bin 01)<input type="checkbox" data-k="calib"></label>
  <label>Simulation (Bin 01 fill)<input type="checkbox" data-k="simFill"></label>
  <label>Unsaved changes<input type="checkbox" data-k="dirty"></label>
  <label>Unread alerts<input type="number" step="1" data-k="unread"></label>
  <label>Notifications<select data-k="notif"><option value="granted">Allowed</option><option value="default">Not asked</option><option value="denied">Blocked</option></select></label>
 </div>
 <button class="pill2" id="simReset" style="margin-top:10px">Reset all</button>
</div>
<script>
const $=s=>document.querySelector(s);
const DEV={s23u:{w:384,h:832},a56:{w:411,h:891},small:{w:360,h:760}};
let dev='s23u',fz=1,zoom=0,sysDark=false,idx=0,cur=null,tmr=0;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmt=(v,d)=>Number.isFinite(+v)?(+v).toFixed(d==null?1:d):'--';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- icons, copied from dashboard v9 ---------- */
const SV=(b,c)=>'<svg class="ico '+(c||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+b+'</svg>';
const ICONS={
  grid:()=>SV('<rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>'),
  chart:()=>SV('<path d="M3 20h18"/><path d="M5 15l4.5-5 3.5 3L19 6"/>'),
  sliders:()=>SV('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/>'),
  flask:()=>SV('<path d="M9.5 3v6.2L4.6 18a2 2 0 0 0 1.7 3h11.4a2 2 0 0 0 1.7-3L14.5 9.2V3"/><path d="M8 3h8M7.4 15h9.2"/>'),
  bell:()=>SV('<path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.4 20.5a2 2 0 0 0 3.2 0"/>'),
  plus:()=>SV('<path d="M12 5v14M5 12h14"/>'),
  gear:()=>SV('<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/>'),
  truck:()=>SV('<path d="M2 7h11v9H2zM13 10h4.5l3.5 3.5V16h-8z"/><circle cx="6.5" cy="18.5" r="1.8"/><circle cx="16.5" cy="18.5" r="1.8"/>'),
  check:()=>SV('<path d="M4 12.5l5 5L20 6.5"/>'),
  temp:(t)=>{const f=clamp(((t==null?28:t)-10)/40,0.05,1),h=(6*f+1.4).toFixed(1),y=(15.4-h).toFixed(1);
    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'+
    '<circle class="halo" cx="12" cy="17.2" r="5.4" fill="currentColor" stroke="none"/>'+
    '<path d="M14.2 14.4V5.2a2.2 2.2 0 1 0-4.4 0v9.2a4.6 4.6 0 1 0 4.4 0z"/>'+
    '<rect x="10.6" y="'+y+'" width="2.8" height="'+h+'" rx="1.4" fill="currentColor" stroke="none"/>'+
    '<circle cx="12" cy="17.2" r="2.6" fill="currentColor" stroke="none"/></svg>'},
  humid:()=>'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">'+
    '<path d="M12 3.2s6.2 6.6 6.2 10.3a6.2 6.2 0 1 1-12.4 0C5.8 9.8 12 3.2 12 3.2z"/>'+
    '<circle class="pulse" cx="12" cy="14.4" r="3" fill="currentColor" stroke="none" opacity=".45"/></svg>',
  gas:()=>'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'+
    '<path class="vap" d="M6.5 17c0-2.6 2.6-2.6 2.6-5.2S6.5 9.2 6.5 6.6"/>'+
    '<path class="vap v2" d="M12 18c0-2.6 2.6-2.6 2.6-5.2S12 10.2 12 7.6"/>'+
    '<path class="vap v3" d="M17.5 17c0-2.6 2.6-2.6 2.6-5.2s-2.6-2.6-2.6-5.2"/></svg>',
  press:()=>SV('<path d="M4.6 17.6a8.6 8.6 0 1 1 14.8 0"/><path d="M12 14l3.6-4.4"/><circle cx="12" cy="14.2" r="1.5" fill="currentColor" stroke="none"/><path d="M7.2 17.6h9.6"/>'),
  weight:(f)=>'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+

function fbCheck(f){
  if(!/^https:\/\/.+\.(firebasedatabase\.app|firebaseio\.com)$/.test(f.url))return 'The database URL is wrong. It starts with https:// and ends in .firebasedatabase.app.';
  if(!/^AIza.{35}$/.test(f.key))return 'The Web API key is wrong. Copy it again from the Firebase console.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)||String(f.pass).length<6)return 'Wrong email or password.';
  return '';
}

/* ---------- simulation ---------- */
const SENSORS=[{key:'fill',bit:0,label:'Fill level',icon:'fill',kind:'range',min:0,max:100,step:1,unit:'%',cc:'var(--c-fill)'},
  {key:'weight',bit:1,label:'Weight',icon:'weight',kind:'num',cc:'var(--c-weight)'},
  {key:'gas',bit:2,label:'Air quality',icon:'gas',kind:'range',min:0,max:500,step:5,unit:'IAQ',cc:'var(--c-gas)'},
  {key:'temp',bit:3,label:'Temperature and humidity',icon:'temp',kind:'pair',cc:'var(--c-temp)'},
  {key:'tamper',bit:4,label:'Tamper',icon:'tamper',kind:'toggle',cc:'var(--c-tamper)'},
  {key:'motion',bit:5,label:'Motion',icon:'motion',kind:'toggle',cc:'var(--c-motion)'},
  {key:'lid',bit:6,label:'Lid',icon:'lid',kind:'lid',cc:'var(--c-lid)'}];
const SIMF={weight:['g',100,0,5000],temp:['°C',.5,-40,85],humidity:['%',1,0,100]};
function simStep(k,v){const f=SIMF[k];return '<div class="well"><button class="step" data-a="simstep" data-v="'+k+':-1">−</button><span class="num">'+fmt(v,k==='temp'?1:0)+'</span><span class="u">'+f[0]+'</span><button class="step" data-a="simstep" data-v="'+k+':1">+</button></div>'}
function Sim(st){
  const i=Math.min(st.selSim,st.bins.length-1),b=st.bins[i];if(!b)return '<div class="scroll"></div>';
  const v=b.sim.values;
  const rows=SENSORS.map(s=>{const man=(b.sim.mask>>s.bit)&1;let ctl;
    if(s.kind==='range')ctl='<input type="range" min="'+s.min+'" max="'+s.max+'" step="'+s.step+'" value="'+v[s.key]+'" data-sv="'+s.key+'"><span class="rv"><b data-rv="'+s.key+'">'+v[s.key]+'</b><small>'+s.unit+'</small></span>';
    else if(s.kind==='num')ctl=simStep('weight',v.weight);
    else if(s.kind==='pair')ctl=simStep('temp',v.temp)+simStep('humidity',v.humidity);
    else if(s.kind==='lid')ctl='<span class="twoway full" style="flex:1;--cc:var(--c-lid)">'+tw('simtw','lid:0',!+v.lid,icon('lock',true),'CLOSED','var(--c-lid)')+tw('simtw','lid:1',!!+v.lid,icon('lid',true),'OPEN','var(--c-lid)')+'</span>';
    else ctl='<span class="twoway full" style="flex:1">'+tw('simtw',s.key+':0',!+v[s.key],icon('cross'),'OFF',s.cc)+tw('simtw',s.key+':1',!!+v[s.key],icon(s.icon,true),'TRIGGERED',s.cc)+'</span>';
    return '<div class="simrow" data-manual="'+man+'" style="--cc:'+s.cc+'"><div class="simtop"><span class="simname">'+icon(s.icon,s.key==='motion'?!!+v.motion:s.key==='lid'?!!+v.lid:undefined)+esc(s.label)+'</span>'+
      '<button class="btn sm modebtn'+(man?'':' tint')+'" data-mode="'+(man?'MANUAL':'AUTO')+'" data-a="simmode" data-v="'+s.bit+'">'+icon(man?'flask':'check')+'<span>'+(man?'MANUAL':'AUTO')+'</span></button></div>'+
      '<div class="simval'+(man?'':' off')+(s.kind==='pair'?' col':'')+'">'+ctl+'</div></div>'}).join('');
  return '<div class="scroll"><div class="sechead" style="min-height:0"><h2 class="sh" style="--cc:var(--sim)">'+icon('flask')+'<span>Simulation</span></h2></div>'+binSeg(st,'simbin',i,false,DEV[dev].w-28)+
    '<p class="hint" style="margin-top:-6px">AUTO reads the real hardware and lets the firmware drive the outputs. MANUAL holds the value you set, one row at a time.</p>'+
    (st.link==='cloud'?'<div class="calbar"><span class="calico" style="color:var(--c-cloud)">'+icon('cloud')+'</span><span class="caltxt"><b>Simulation needs the bins\u2019 Wi-Fi</b><span>The app is on cloud now, so APPLY rests until a bin answers on Wi-Fi again.</span></span></div>':'')+rows+
    '<div class="savebar" style="box-shadow:var(--o2)"><button class="btn accent" style="flex:1" data-a="apply"'+(st.link==='cloud'?' disabled':'')+'>'+icon('flask')+'<span>APPLY</span></button><button class="btn tint" style="--cc:var(--ok);flex:1" data-a="simoff"'+(b.sim.mask?'':' disabled')+'>'+icon('reload')+'<span>ALL TO AUTO</span></button></div>'+
    '<p class="hint" style="text-align:center">The whole app turns violet while any sensor is manual.</p></div>';

/* ---------- alerts ---------- */
/* Filter by kind and by date, and Mark read and Delete act on exactly what is shown (Garbage-Guard history tools). */
const AKINDS=[['all','layers','All'],['full','fill','Full bins'],['sensor','temp','Sensor readings'],['tamper','tamper','Tamper'],['lock','lock','Lock and unlock'],['pickup','truck','Pickups'],['setup','calib','Calibration and settings']];
const AKNAME={all:['alert','alerts'],full:['full-bin alert','full-bin alerts'],sensor:['sensor alert','sensor alerts'],tamper:['tamper alert','tamper alerts'],lock:['lock event','lock events'],pickup:['pickup','pickups'],setup:['setup event','setup events']};
const ARANGE=[['today','Today',581],['7','7 days',10080],['30','30 days',43200],['any','Any',1e9]];
function shownAlerts(st){const lim=(ARANGE.find(r=>r[0]===st.arange)||ARANGE[3])[2];
  return allAlerts(st).filter(a=>(st.akind==='all'||a.k===st.akind)&&(a.m||0)<=lim)}
function scopeTxt(st,n){const nm=AKNAME[st.akind]||AKNAME.all,w=n===1?nm[0]:nm[1],r={today:' from today','7':' from the last 7 days','30':' from the last 30 days',any:''}[st.arange];
  return (st.akind==='all'&&st.arange==='any'?'all '+n+' '+w:n+' '+w)+r}
function Alerts(st){
  const every=allAlerts(st),un=unreadN(st),filt=shownAlerts(st),unShown=filt.filter(a=>!isRead(st,a)).length;
  const all=filt.slice(0,st.alertShown);
  const sv={critical:['var(--bad)','CRITICAL'],warning:['var(--warn)','WARNING'],info:['var(--sim)','INFO'],success:['var(--ok)','RESOLVED']};
  const list=all.length?all.map(a=>{const s=sv[a.sev],rd=isRead(st,a);
    return '<div class="alert" data-lv="'+a.sev+'" data-read="'+(rd?1:0)+'" style="--cc:'+s[0]+'"><button class="rd" data-a="readtog" data-v="'+a.id+'" aria-label="'+(rd?'Mark as unread':'Mark as read')+'"><i></i></button>'+
      '<span class="av" style="color:'+(a.sev==='critical'?'#fff':s[0])+'">'+icon(a.ic)+'</span><span style="flex:1;min-width:0"><span class="ttl">'+a.title+'</span><div class="meta">'+a.meta+' · '+a.ago+'</div></span>'+
      '<span class="lvtag" style="'+(a.sev==='critical'?'':'background:'+s[0])+'">'+s[1]+'</span><button class="del" data-a="delalert" data-v="'+a.id+'" aria-label="Remove">'+icon('cross')+'</button></div>'}).join('')
    :'<div class="pcard nm"><div class="empty">'+icon('bell')+'<span>'+(every.length?'No alerts match. Change the kind or the dates.':'No alerts yet. This fills up as bins reach their limits.')+'</span></div></div>';
  return '<div class="scroll"><div class="sechead" style="min-height:0"><h2 class="sh" style="--cc:var(--c-tamper)">'+icon('clock')+'<span>Alert history</span></h2>'+(un?'<em class="unreadpip">'+un+' UNREAD</em>':'')+'</div>'+
    '<div class="twoway full akind">'+AKINDS.map(x=>'<button class="tw" data-a="akind" data-v="'+x[0]+'" aria-pressed="'+(st.akind===x[0])+'" aria-label="'+x[2]+'" title="'+x[2]+'" style="--cc:'+(x[0]==='all'?'var(--ink)':'var(--c-tamper)')+'">'+icon(x[1])+'</button>').join('')+'</div>'+
    '<div class="twoway full arange">'+ARANGE.map(r=>tw('arange',r[0],st.arange===r[0],'',r[1],'var(--c-tamper)')).join('')+'</div>'+
    '<p class="scope">'+(filt.length?'Showing '+scopeTxt(st,filt.length):'No alerts match.')+'<small>'+(filt.length?(AKINDS.find(x=>x[0]===st.akind)||AKINDS[0])[2]+(unShown?', '+unShown+' unread':', all read'):'Change the kind or the dates.')+'</small></p>'+
    '<div class="acts"><button class="btn sm tint" style="--cc:var(--ok)" data-a="markshown"'+(unShown?'':' disabled')+'>'+icon('check')+'<span>MARK READ</span></button><button class="btn sm tint" style="--cc:var(--c-tamper)" data-a="clearask"'+(filt.length?'':' disabled')+'>'+icon('trash')+'<span>DELETE</span></button></div>'+
    '<div class="alerts">'+list+'</div>'+(filt.length>all.length?'<button class="btn block" data-a="aolder">'+icon('clock')+'<span>Show older ('+(filt.length-all.length)+' more)</span></button>':'')+(all.length?'<p class="hint" style="text-align:center">MARK READ and DELETE act on exactly the alerts shown. Tap the dot to mark one read or unread. The cross removes one alert.</p>':'')+'</div>';
}

/* ---------- v3: operator PIN and Bluetooth pairing code ----------
   The same rules as app 1.2 and dashboard v12. In this mockup the operator
   PIN is made the first time Operator is picked (demo: try 1357). */
let OP_PIN=null,OP_MISS=0,OP_UNTIL=0;
const BTC={code:'',at:0,fails:0,until:0};
function btNew(){BTC.code=String(Math.floor(Math.random()*1e6)).padStart(6,'0');BTC.at=Date.now();}
function pinOpen(st,mode,first){st.overlay='pin';st.pin={mode,first,buf:'',first1:'',msg:null};}
function PinSheet(st){
  const p=st.pin,m=p.mode,bt=m==='bt',again=!!p.first1;
  const T={unlock:['Operator PIN','Collector is the default. Enter the operator PIN to calibrate, simulate and edit bins.','UNLOCK'],
    set:[p.change?'New operator PIN':'Create the operator PIN',again?'Type it once more to be sure.':'4 to 8 digits. Anyone without it stays a collector. Only an operator can change it later.',again?'SAVE':'NEXT'],
    change:['Change operator PIN','Enter the current PIN first.','NEXT'],
    bt:['Type the pairing code','Tap Pair phone on '+esc(st.bins[st.selSet].name)+'’s touchscreen, then type the 6 digits it shows. The code changes every time.','PAIR']}[m];
  const lo=bt?6:4,n=Math.max(lo,p.buf.length);
  const left=Math.max(0,Math.ceil((60000-(Date.now()-BTC.at))/1000));
  return '<div class="scrim" data-a="close"></div><div class="sheet"><div class="grab"></div>'+
    (bt?'<div class="binscr"><small>STAND-IN FOR '+esc(st.bins[st.selSet].name).toUpperCase()+'’S SCREEN</small><span class="pc">PAIRING CODE</span><b>'+BTC.code.slice(0,3)+' '+BTC.code.slice(3)+'</b><small>Expires in '+left+' s</small></div>':'')+
    '<div class="pico">'+(bt?icon('bluetooth'):m==='set'?icon('key'):icon('lock',true))+'</div>'+
    '<h3 style="justify-content:center;text-align:center">'+T[0]+'</h3><p style="text-align:center">'+T[1]+'</p>'+
    '<div class="pdots">'+Array.from({length:n},(_,i)=>'<i class="'+(i<p.buf.length?'on':'')+'"></i>').join('')+'</div>'+
    '<div class="pmsg '+(p.msg?(p.msg[0]?'ok':'bad'):'')+'">'+(p.msg?p.msg[1]:'')+'</div>'+
    '<div class="pkeys">'+'123456789'.split('').map(d=>'<button class="btn" data-a="pk" data-v="'+d+'">'+d+'</button>').join('')+
    '<button class="btn" data-a="pk" data-v="back"'+(p.buf?'':' disabled')+'>⌫</button><button class="btn" data-a="pk" data-v="0">0</button>'+
    '<button class="btn go" data-a="pk" data-v="go"'+(p.buf.length>=lo?'':' disabled')+'>'+T[2]+'</button></div></div>';
}
function pinKey(st,k){
  const p=st.pin,bt=p.mode==='bt',lo=bt?6:4,hi=bt?6:8;
  if(k==='back'){p.buf=p.buf.slice(0,-1);return}
  if(k!=='go'){if(p.buf.length<hi)p.buf+=k;return}
  if(p.buf.length<lo)return;
  const b=st.bins[st.selSet];
  if(bt){
    if(Date.now()-BTC.at>60000){btNew();p.buf='';p.msg=[0,'That code expired. The bin shows a new one.'];return}
    if(p.buf===BTC.code){st.overlay='';st.bt=1;draw();return toast('Paired with '+b.name+'. The Bluetooth link is encrypted.')}
    p.buf='';BTC.fails++;
    if(BTC.fails>=3){st.overlay='';BTC.until=Date.now()+60000;draw();return toast('3 wrong codes. '+b.name+' stops pairing for 60 s.')}
    p.msg=[0,'Wrong code. '+(3-BTC.fails)+' '+(3-BTC.fails===1?'try':'tries')+' left.'];return}
  if(p.mode==='set'){
    if(!p.first1){p.first1=p.buf;p.buf='';p.msg=[1,'Type the same PIN again.'];return}
    if(p.buf!==p.first1){p.buf='';p.first1='';p.msg=[0,'The two PINs differ. Start again.'];return}
    OP_PIN=p.buf;st.overlay='';
    if(p.change){draw();return toast('Operator PIN changed.')}
    return opIn(st,p.first)}
  const w=OP_UNTIL-Date.now();
  if(w>0){p.buf='';p.msg=[0,'Too many wrong PINs. Try again in '+Math.ceil(w/1000)+' s.'];return}
  if(p.buf===OP_PIN){OP_MISS=0;
    if(p.mode==='change'){st.pin={mode:'set',change:true,first:false,buf:'',first1:'',msg:null};return}
    st.overlay='';return opIn(st,p.first)}
  p.buf='';OP_MISS++;
  if(OP_MISS>=5)OP_UNTIL=Date.now()+30000*Math.pow(2,Math.min(OP_MISS-5,6));
  const w2=OP_UNTIL-Date.now();
  p.msg=[0,w2>0?'Wrong PIN. Locked for '+Math.ceil(w2/1000)+' s.':'Wrong PIN. '+(5-OP_MISS)+' tries before a wait.'];
}
function opIn(st,first){
  st.role='operator';
  if(first){st.screen='overview';st.overlay='notifpre';draw();return}
  draw();toast('Signed in as operator.');
}
