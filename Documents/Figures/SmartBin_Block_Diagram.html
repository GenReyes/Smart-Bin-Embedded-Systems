<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#D9D0C5;--base:#E4DCD2;--shL:#FFFBF5;--shD:#BEB2A4;--ink:#2A241E;--ink2:#6E6458;--line:#3D352D}
body.paper{--page:#ECECEC;--base:#FFFFFF;--shL:#FFFFFF;--shD:#D2D2D2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
.bar{max-width:8.5in;margin:18px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px}
.bar h1{font-size:13px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:var(--ink2);margin:0;flex:1}
.bar button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--base);border:0;border-radius:12px;padding:8px 14px;cursor:pointer;
  box-shadow:-4px -4px 9px var(--shL),4px 4px 9px var(--shD)}
.bar button:active{box-shadow:inset -3px -3px 7px var(--shL),inset 3px 3px 7px var(--shD)}
.hint{max-width:8.5in;margin:6px auto 0;padding:0 16px;font-size:12px;color:var(--ink2)}
/* US Letter sheet; the figure is sized for the 6.5 in text width between 1 in margins */
.sheet{width:8.5in;max-width:calc(100% - 32px);margin:14px auto 30px;background:var(--base);padding:0.5in 1in;
  box-shadow:-8px -8px 18px var(--shL),8px 8px 18px var(--shD);border-radius:6px}
#figure{background:var(--base);padding:10px 0}
#figure svg{display:block;width:100%;height:auto}
@media (max-width:700px){.sheet{padding:16px}}
@media print{.bar,.hint{display:none}html,body{background:#fff}.sheet{box-shadow:none;margin:0;padding:0}}
</style></head>
