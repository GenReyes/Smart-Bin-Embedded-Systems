<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#D9D0C5;--base:#E4DCD2;--shL:#FFFBF5;--shD:#BEB2A4;--ink:#2A241E;--ink2:#6E6458;--line:#2A241E;--well:#DED5CA}
body.paper{--page:#ECECEC;--base:#FFFFFF;--shL:#FFFFFF;--shD:#CFCFCF;--well:#F1F1F1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
.bar{max-width:8.5in;margin:18px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px}
.bar h1{font-size:13px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:var(--ink2);margin:0;flex:1}
.bar button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--base);border:0;border-radius:12px;padding:8px 14px;cursor:pointer;
  box-shadow:-4px -4px 9px var(--shL),4px 4px 9px var(--shD)}
.bar button:active{box-shadow:inset -3px -3px 7px var(--shL),inset 3px 3px 7px var(--shD)}
.hint{max-width:8.5in;margin:6px auto 0;padding:0 16px;font-size:12px;color:var(--ink2)}
/* US Letter sheet; the figure is sized for the 6.5 in text width between 1 in margins */
.sheet{width:8.5in;max-width:calc(100% - 32px);margin:14px auto 30px;background:var(--base);padding:0.5in 1in;
  box-shadow:-8px -8px 18px var(--shL),8px 8px 18px var(--shD);border-radius:6px}
#figure{background:var(--base);padding:10px 0}
#figure svg{display:block;width:100%;height:auto}
@media (max-width:700px){.sheet{padding:16px}}
@media print{.bar,.hint{display:none}html,body{background:#fff}.sheet{box-shadow:none;margin:0;padding:0}}
</style></head>
<body>
<div class="bar"><h1>Smart-Bin &middot; SWOT</h1>
<button onclick="document.body.classList.toggle('paper')">Beige / white</button></div>
<p class="hint">Screenshot the sheet below, or use the PNG saved beside this file. Beige follows the Smart-Bin app; white suits the paper.</p>
<div class="sheet"><div id="figure"><svg id="swot" viewBox="0 0 780 692" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Arial, sans-serif"><defs><filter id="nm" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="5" dy="5" stdDeviation="4.5" style="flood-color:var(--shD)"/><feDropShadow dx="-4.5" dy="-4.5" stdDeviation="4" style="flood-color:var(--shL)"/></filter><filter id="inset" x="-20%" y="-20%" width="140%" height="140%"><feOffset dx="2" dy="2" in="SourceAlpha" result="o"/><feGaussianBlur in="o" stdDeviation="1.6" result="b"/><feComposite in="SourceAlpha" in2="b" operator="out" result="sh"/><feFlood style="flood-color:var(--shD)"/><feComposite in2="sh" operator="in" result="dark"/><feOffset dx="-2" dy="-2" in="SourceAlpha" result="o2"/><feGaussianBlur in="o2" stdDeviation="1.6" result="b2"/><feComposite in="SourceAlpha" in2="b2" operator="out" result="sh2"/><feFlood style="flood-color:var(--shL)"/><feComposite in2="sh2" operator="in" result="light"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge></filter><marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs><rect x="20.0" y="20.0" width="364" height="316" rx="14" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="15.0" y="15.0" width="364" height="316" rx="14" fill="var(--base)" stroke="#2A241E" stroke-width="2.2"/><rect x="12" y="12" width="364" height="40" rx="14" fill="#1E8E3E" stroke="#2A241E" stroke-width="2.2"/><rect x="13" y="34" width="362" height="18" fill="#1E8E3E"/><line x1="12" y1="52" x2="376" y2="52" stroke="#2A241E" stroke-width="2.2"/><text x="28" y="32" font-size="14" font-weight="800" letter-spacing="1.6" fill="#fff" dominant-baseline="central">STRENGTHS</text><text x="360" y="32" font-size="10" font-weight="700" fill="#fff" text-anchor="end" dominant-baseline="central">internal</text><circle cx="32" cy="75" r="3.4" fill="#1E8E3E" stroke="#2A241E" stroke-width="1.2"/><text x="46" y="74" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Broad sensing on one low-cost ESP32 board: fill</text><text x="46" y="89" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">level, weight, temperature, humidity, pressure,</text><text x="46" y="104" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">air quality and tilt</text><circle cx="32" cy="131" r="3.4" fill="#1E8E3E" stroke="#2A241E" stroke-width="1.2"/><text x="46" y="130" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Touchscreen, web dashboard and Android app</text><text x="46" y="145" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">share one design, with operator and collector</text><text x="46" y="160" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">roles</text><circle cx="32" cy="187" r="3.4" fill="#1E8E3E" stroke="#2A241E" stroke-width="1.2"/><text x="46" y="186" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Local Wi-Fi answers in about 1s, while Firebase</text><text x="46" y="201" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">and ThingSpeak keep status and history</text><circle cx="32" cy="228" r="3.4" fill="#1E8E3E" stroke="#2A241E" stroke-width="1.2"/><text x="46" y="227" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Sensors can be simulated and calibrated from</text><text x="46" y="242" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">the interface, so tests repeat without</text><text x="46" y="257" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">reflashing</text><circle cx="32" cy="284" r="3.4" fill="#1E8E3E" stroke="#2A241E" stroke-width="1.2"/><text x="46" y="283" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">About ₱4,900 of parts for both bins, batteries</text><text x="46" y="298" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">included</text><rect x="402.0" y="20.0" width="364" height="316" rx="14" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="397.0" y="15.0" width="364" height="316" rx="14" fill="var(--base)" stroke="#2A241E" stroke-width="2.2"/><rect x="394" y="12" width="364" height="40" rx="14" fill="#E0962A" stroke="#2A241E" stroke-width="2.2"/><rect x="395" y="34" width="362" height="18" fill="#E0962A"/><line x1="394" y1="52" x2="758" y2="52" stroke="#2A241E" stroke-width="2.2"/><text x="410" y="32" font-size="14" font-weight="800" letter-spacing="1.6" fill="#fff" dominant-baseline="central">WEAKNESSES</text><text x="742" y="32" font-size="10" font-weight="700" fill="#fff" text-anchor="end" dominant-baseline="central">internal</text><circle cx="414" cy="75" r="3.4" fill="#E0962A" stroke="#2A241E" stroke-width="1.2"/><text x="428" y="74" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Two table-size prototypes, not weatherproof and</text><text x="428" y="89" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">not yet tried in the field</text><circle cx="414" cy="116" r="3.4" fill="#E0962A" stroke="#2A241E" stroke-width="1.2"/><text x="428" y="115" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Needs Wi-Fi, and the free cloud tiers limit the</text><text x="428" y="130" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">update rate</text><circle cx="414" cy="157" r="3.4" fill="#E0962A" stroke="#2A241E" stroke-width="1.2"/><text x="428" y="156" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">The BME680 gives an estimated air-quality</text><text x="428" y="171" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">index, not a gas concentration, and needs about</text><text x="428" y="186" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">5 minutes to warm up</text><circle cx="414" cy="213" r="3.4" fill="#E0962A" stroke="#2A241E" stroke-width="1.2"/><text x="428" y="212" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Estimated battery life is about 18 hours for</text><text x="428" y="227" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Bin A and 9 hours for Bin B</text><circle cx="414" cy="254" r="3.4" fill="#E0962A" stroke="#2A241E" stroke-width="1.2"/><text x="428" y="253" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Collection priority ranks bins; it does not</text><text x="428" y="268" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">plan routes over roads</text><rect x="20.0" y="354.0" width="364" height="316" rx="14" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="15.0" y="349.0" width="364" height="316" rx="14" fill="var(--base)" stroke="#2A241E" stroke-width="2.2"/><rect x="12" y="346" width="364" height="40" rx="14" fill="#1F6FA8" stroke="#2A241E" stroke-width="2.2"/><rect x="13" y="368" width="362" height="18" fill="#1F6FA8"/><line x1="12" y1="386" x2="376" y2="386" stroke="#2A241E" stroke-width="2.2"/><text x="28" y="366" font-size="14" font-weight="800" letter-spacing="1.6" fill="#fff" dominant-baseline="central">OPPORTUNITIES</text><text x="360" y="366" font-size="10" font-weight="700" fill="#fff" text-anchor="end" dominant-baseline="central">external</text><circle cx="32" cy="409" r="3.4" fill="#1F6FA8" stroke="#2A241E" stroke-width="1.2"/><text x="46" y="408" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">RA 9003 places collection on barangays,</text><text x="46" y="423" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">municipalities and cities</text><circle cx="32" cy="450" r="3.4" fill="#1F6FA8" stroke="#2A241E" stroke-width="1.2"/><text x="46" y="449" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Metro Manila collects only about 60% of the</text><text x="46" y="464" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">waste it generates</text><circle cx="32" cy="491" r="3.4" fill="#1F6FA8" stroke="#2A241E" stroke-width="1.2"/><text x="46" y="490" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Only 1 of the 30 reviewed studies senses tilt</text><text x="46" y="505" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">and only 2 offer role-based views</text><circle cx="32" cy="532" r="3.4" fill="#1F6FA8" stroke="#2A241E" stroke-width="1.2"/><text x="46" y="531" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Campus and barangay pilots are realistic next</text><text x="46" y="546" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">steps</text><circle cx="32" cy="573" r="3.4" fill="#1F6FA8" stroke="#2A241E" stroke-width="1.2"/><text x="46" y="572" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">LoRa, solar power and road routing can be added</text><text x="46" y="587" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">later</text><rect x="402.0" y="354.0" width="364" height="316" rx="14" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="397.0" y="349.0" width="364" height="316" rx="14" fill="var(--base)" stroke="#2A241E" stroke-width="2.2"/><rect x="394" y="346" width="364" height="40" rx="14" fill="#D93025" stroke="#2A241E" stroke-width="2.2"/><rect x="395" y="368" width="362" height="18" fill="#D93025"/><line x1="394" y1="386" x2="758" y2="386" stroke="#2A241E" stroke-width="2.2"/><text x="410" y="366" font-size="14" font-weight="800" letter-spacing="1.6" fill="#fff" dominant-baseline="central">THREATS</text><text x="742" y="366" font-size="10" font-weight="700" fill="#fff" text-anchor="end" dominant-baseline="central">external</text><circle cx="414" cy="409" r="3.4" fill="#D93025" stroke="#2A241E" stroke-width="1.2"/><text x="428" y="408" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Mature commercial systems such as Bigbelly,</text><text x="428" y="423" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Ecube Labs, Sensoneo and Nordsense</text><circle cx="414" cy="450" r="3.4" fill="#D93025" stroke="#2A241E" stroke-width="1.2"/><text x="428" y="449" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Vandalism, theft, water and heat in outdoor use</text><circle cx="414" cy="476" r="3.4" fill="#D93025" stroke="#2A241E" stroke-width="1.2"/><text x="428" y="475" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Unstable internet and power outages</text><circle cx="414" cy="502" r="3.4" fill="#D93025" stroke="#2A241E" stroke-width="1.2"/><text x="428" y="501" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Collectors may resist a new app, and phones and</text><text x="428" y="516" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">data cost money</text><circle cx="414" cy="543" r="3.4" fill="#D93025" stroke="#2A241E" stroke-width="1.2"/><text x="428" y="542" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">Changes to free cloud tiers and data privacy</text><text x="428" y="557" font-size="11.5" font-weight="600" fill="var(--ink)" dominant-baseline="central">rules</text></svg></div></div>
</body></html>
