<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator Flowchart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#D9D0C5;--base:#E4DCD2;--shL:#FFFBF5;--shD:#BEB2A4;--ink:#2A241E;--ink2:#6E6458;--line:#2A241E;--well:#DED5CA}
body.paper{--page:#ECECEC;--base:#FFFFFF;--shL:#FFFFFF;--shD:#CFCFCF;--well:#F1F1F1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
.bar{max-width:8.5in;margin:18px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px}
.bar h1{font-size:13px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:var(--ink2);margin:0;flex:1}
.bar button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--base);border:0;border-radius:12px;padding:8px 14px;cursor:pointer;
  box-shadow:-4px -4px 9px var(--shL),4px 4px 9px var(--shD)}
.bar button:active{box-shadow:inset -3px -3px 7px var(--shL),inset 3px 3px 7px var(--shD)}
.hint{max-width:8.5in;margin:6px auto 0;padding:0 16px;font-size:12px;color:var(--ink2)}
/* US Letter sheet; the figure is sized for the 6.5 in text width between 1 in margins */
.sheet{width:8.5in;max-width:calc(100% - 32px);margin:14px auto 30px;background:var(--base);padding:0.5in 1in;
  box-shadow:-8px -8px 18px var(--shL),8px 8px 18px var(--shD);border-radius:6px}
#figure{background:var(--base);padding:10px 0}
#figure svg{display:block;width:100%;height:auto}
@media (max-width:700px){.sheet{padding:16px}}
@media print{.bar,.hint{display:none}html,body{background:#fff}.sheet{box-shadow:none;margin:0;padding:0}}
</style></head>

ke-width="2.2"/><rect x="412.0" y="971.3999999999999" width="116" height="30" rx="15.0" fill="#1E8E3E" stroke="#2A241E" stroke-width="2.2"/><text x="470.0" y="986.8999999999999" font-size="12" font-weight="800" letter-spacing="2" fill="#fff" text-anchor="middle" dominant-baseline="central">END</text><line x1="40" y1="1014.3999999999999" x2="900" y2="1014.3999999999999" stroke="#D8D2CA" stroke-width="1.5"/><text x="62" y="1028.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">PIN.</tspan><tspan font-weight="500" fill="#4A4036"> The app and dashboard open as collector. Operator needs a 4 to 8 digit</tspan></text><text x="62" y="1040.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">PIN; 5 misses wait 30 s, doubling each time. Operator drops back to</text><text x="62" y="1052.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">collector after 2 min in the background.</text><text x="62" y="1071.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Bins.</tspan><tspan font-weight="500" fill="#4A4036"> Only an operator adds or edits a bin: name, place, IP address, Firebase</tspan></text><text x="62" y="1083.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">cloud name and ThingSpeak channel.</text><circle cx="48" cy="1102.3999999999999" r="8" fill="#2A241E"/><text x="48" y="1102.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">1</text><text x="62" y="1102.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Collector tasks.</tspan><tspan font-weight="500" fill="#4A4036"> An operator can do everything a collector does: alerts, COLLECT and</tspan></text><text x="62" y="1114.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">DONE, LOCK and UNLOCK, charts and history.</text><circle cx="48" cy="1133.3999999999999" r="8" fill="#2A241E"/><text x="48" y="1133.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">2</text><text x="62" y="1133.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Tamper.</tspan><tspan font-weight="500" fill="#4A4036"> A latched tamper keeps the lid shut. The operator checks the bin, then</tspan></text><text x="62" y="1145.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">sends RESET TAMPER.</text><circle cx="498.0" cy="1028.3999999999999" r="8" fill="#2A241E"/><text x="498.0" y="1028.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">3</text><text x="512.0" y="1028.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Calibrate.</tspan><tspan font-weight="500" fill="#4A4036"> One bin at a time over Wi-Fi: fill range, alert limits, BME680</tspan></text><text x="512.0" y="1040.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">offsets, lid angles, tare and weight. Kept in the bin through a</text><text x="512.0" y="1052.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">restart.</text><circle cx="498.0" cy="1071.3999999999999" r="8" fill="#2A241E"/><text x="498.0" y="1071.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">4</text><text x="512.0" y="1071.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Simulate.</tspan><tspan font-weight="500" fill="#4A4036"> Hold any sensor at a test value for a demo. The SIMULATION banner stays</tspan></text><text x="512.0" y="1083.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">until ALL TO AUTO.</text><circle cx="498.0" cy="1102.3999999999999" r="8" fill="#2A241E"/><text x="498.0" y="1102.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">5</text><text x="512.0" y="1102.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Settings.</tspan><tspan font-weight="500" fill="#4A4036"> Sound, vibration and theme; the operator PIN changes only after typing</tspan></text><text x="512.0" y="1114.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">the current one.</text><rect x="196.0" y="1168.8999999999999" width="32" height="15" rx="7.5" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="194.0" y="1166.8999999999999" width="32" height="15" rx="7.5" fill="#1E8E3E" stroke="#2A241E" stroke-width="2.2"/><text x="232.0" y="1174.4" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Start / End</text><rect x="298.0" y="1165.3999999999999" width="32" height="18" rx="4" fill="#EEE7F5" stroke="#7A45B5" stroke-width="2"/><text x="336.0" y="1174.4" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Process</text><polygon points="404.0,1166.8999999999999 417.0,1176.3999999999999 404.0,1185.8999999999999 391.0,1176.3999999999999" stroke-linejoin="round" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><polygon points="402.0,1164.8999999999999 415.0,1174.3999999999999 402.0,1183.8999999999999 389.0,1174.3999999999999" stroke-linejoin="round" fill="#E0962A" stroke="#2A241E" stroke-width="2.2"/><text x="424.0" y="1174.4" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Decision</text><polygon points="491.0,1165.3999999999999 510.0,1165.3999999999999 497.0,1183.3999999999999 478.0,1183.3999999999999" stroke-linejoin="round" fill="#E2ECF4" stroke="#1F6FA8" stroke-width="2"/><text x="516.0" y="1174.4" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Input / Output</text><path transform="translate(598.0,1163.3999999999999) scale(0.3200,0.3438)" vector-effect="non-scaling-stroke" d="M22,60 A15,15 0 0 1 12,33 A16,16 0 0 1 34,14 A21,21 0 0 1 70,11 A17,17 0 0 1 91,31 A15,15 0 0 1 80,60 Z" fill="#FAEBE2" stroke="#D9631E" stroke-width="2"/><text x="636.0" y="1174.4" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Cloud</text><text x="710.0" y="1174.4" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Repeat</text></svg></div></div>
