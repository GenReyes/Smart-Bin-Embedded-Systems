<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator Flowchart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#D9D0C5;--base:#E4DCD2;--shL:#FFFBF5;--shD:#BEB2A4;--ink:#2A241E;--ink2:#6E6458;--line:#2A241E;--well:#DED5CA}
body.paper{--page:#ECECEC;--base:#FFFFFF;--shL:#FFFFFF;--shD:#CFCFCF;--well:#F1F1F1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
.bar{max-width:8.5in;margin:18px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px}
.bar h1{font-size:13px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:var(--ink2);margin:0;flex:1}
.bar button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--base);border:0;border-radius:12px;padding:8px 14px;cursor:pointer;
  box-shadow:-4px -4px 9px var(--shL),4px 4px 9px var(--shD)}
.bar button:active{box-shadow:inset -3px -3px 7px var(--shL),inset 3px 3px 7px var(--shD)}
.hint{max-width:8.5in;margin:6px auto 0;padding:0 16px;font-size:12px;color:var(--ink2)}
/* US Letter sheet; the figure is sized for the 6.5 in text width between 1 in margins */
.sheet{width:8.5in;max-width:calc(100% - 32px);margin:14px auto 30px;background:var(--base);padding:0.5in 1in;
  box-shadow:-8px -8px 18px var(--shL),8px 8px 18px var(--shD);border-radius:6px}
#figure{background:var(--base);padding:10px 0}
#figure svg{display:block;width:100%;height:auto}
@media (max-width:700px){.sheet{padding:16px}}
@media print{.bar,.hint{display:none}html,body{background:#fff}.sheet{box-shadow:none;margin:0;padding:0}}
</style></head>

roke-width="2" filter="url(#nm)"/><text x="342.0" y="877.4" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Firebase</text><path transform="translate(703.0,841.3999999999999) scale(1.5000,0.9688)" vector-effect="non-scaling-stroke" d="M22,60 A15,15 0 0 1 12,33 A16,16 0 0 1 34,14 A21,21 0 0 1 70,11 A17,17 0 0 1 91,31 A15,15 0 0 1 80,60 Z" fill="#FAEBE2" stroke="#D9631E" stroke-width="2" filter="url(#nm)"/><text x="778.0" y="877.4" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">ThingSpeak</text><polygon points="455.0,914.3999999999999 678.0,914.3999999999999 665.0,954.3999999999999 442.0,954.3999999999999" stroke-linejoin="round" fill="#E2ECF4" stroke="#1F6FA8" stroke-width="2" filter="url(#nm)"/><text x="560.0" y="928.2" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Show status, charts</text><text x="560.0" y="940.6" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">&amp; alerts</text><rect x="506.0" y="979.3999999999999" width="116" height="30" rx="15.0" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="502.0" y="975.3999999999999" width="116" height="30" rx="15.0" fill="#1E8E3E" stroke="#2A241E" stroke-width="2.2"/><text x="560.0" y="990.8999999999999" font-size="12" font-weight="800" letter-spacing="2" fill="#fff" text-anchor="middle" dominant-baseline="central">END</text><line x1="40" y1="1018.3999999999999" x2="1080" y2="1018.3999999999999" stroke="#D8D2CA" stroke-width="1.5"/><text x="62" y="1032.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">PIN.</tspan><tspan font-weight="500" fill="#4A4036"> The app and dashboard open as collector. Operator needs a 4 to 8 digit PIN; 5 misses wait</tspan></text><text x="62" y="1044.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">30 s, doubling each time. Operator drops back to collector after 2 min in the background.</text><text x="62" y="1063.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Bins.</tspan><tspan font-weight="500" fill="#4A4036"> Only an operator adds or edits a bin: name, place, IP address, Firebase cloud name and</tspan></text><text x="62" y="1075.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">ThingSpeak channel.</text><circle cx="48" cy="1094.3999999999999" r="8" fill="#2A241E"/><text x="48" y="1094.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">1</text><text x="62" y="1094.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Collector tasks.</tspan><tspan font-weight="500" fill="#4A4036"> An operator can do everything a collector does: alerts, COLLECT and DONE, LOCK and</tspan></text><text x="62" y="1106.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">UNLOCK, charts and history, and Bluetooth Wi-Fi setup.</text><circle cx="48" cy="1125.3999999999999" r="8" fill="#2A241E"/><text x="48" y="1125.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">2</text><text x="62" y="1125.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Tamper.</tspan><tspan font-weight="500" fill="#4A4036"> A latched tamper keeps the lid shut and the siren repeating every 2 s. The operator</tspan></text><text x="62" y="1137.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">checks the bin, then sends RESET TAMPER.</text><circle cx="588.0" cy="1032.3999999999999" r="8" fill="#2A241E"/><text x="588.0" y="1032.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">3</text><text x="602.0" y="1032.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Calibrate.</tspan><tspan font-weight="500" fill="#4A4036"> One bin at a time over Wi-Fi: fill range, alert limits, BME680 offsets, upright angle,</tspan></text><text x="602.0" y="1044.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">lid angles and open and close times, tare and weight. Kept in the bin through a</text><text x="602.0" y="1056.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">restart. Calibration mode shows on the app, dashboard and bin screen at once.</text><circle cx="588.0" cy="1075.3999999999999" r="8" fill="#2A241E"/><text x="588.0" y="1075.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">4</text><text x="602.0" y="1075.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Touch calibration.</tspan><tspan font-weight="500" fill="#4A4036"> Start it from the dashboard or app, or hold a finger on the bin&#x27;s screen for 5 s.</tspan></text><text x="602.0" y="1087.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">Press each cross; the result is saved in the bin. Presses too close together fail.</text><circle cx="588.0" cy="1106.3999999999999" r="8" fill="#2A241E"/><text x="588.0" y="1106.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">5</text><text x="602.0" y="1106.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Simulate.</tspan><tspan font-weight="500" fill="#4A4036"> Hold any sensor at a test value for a demo. The SIMULATION banner stays until ALL TO</tspan></text><text x="602.0" y="1118.4" font-size="9.4" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">AUTO.</text><circle cx="588.0" cy="1137.3999999999999" r="8" fill="#2A241E"/><text x="588.0" y="1137.8999999999999" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">6</text><text x="602.0" y="1137.3999999999999" font-size="9.4" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Settings.</tspan><tspan font-weight="500" fill="#4A4036"> Sound, vibration and theme; the operator PIN changes only after typing the current one.</tspan></text><rect x="286.0" y="1160.8999999999999" width="32" height="15" rx="7.5" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="284.0" y="1158.8999999999999" width="32" height="15" rx="7.5" fill="#1E8E3E" stroke="#2A241E" stroke-width="2.2"/><text x="322.0" y="1166.4" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Start / End</text><rect x="388.0" y="1157.3999999999999" width="32" height="18" rx="4" fill="#EEE7F5" stroke="#7A45B5" stroke-width="2"/><text x="426.0" y="1166.4" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Process</text><polygon points="494.0,1158.8999999999999 507.0,1168.3999999999999 494.0,1177.8999999999999 481.0,1168.3999999999999" stroke-linejoin="round" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><polygon points="492.0,1156.8999999999999 505.0,1166.3999999999999 492.0,1175.8999999999999 479.0,1166.3999999999999" stroke-linejoin="round" fill="#E0962A" stroke="#2A241E" stroke-width="2.2"/><text x="514.0" y="1166.4" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Decision</text><polygon points="581.0,1157.3999999999999 600.0,1157.3999999999999 587.0,1175.3999999999999 568.0,1175.3999999999999" stroke-linejoin="round" fill="#E2ECF4" stroke="#1F6FA8" stroke-width="2"/><text x="606.0" y="1166.4" font-size="10" font-weight=
