<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Feature Counts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#D9D0C5;--base:#E4DCD2;--shL:#FFFBF5;--shD:#BEB2A4;--ink:#2A241E;--ink2:#6E6458;--line:#2A241E;--well:#DED5CA}
body.paper{--page:#ECECEC;--base:#FFFFFF;--shL:#FFFFFF;--shD:#CFCFCF;--well:#F1F1F1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
.bar{max-width:8.5in;margin:18px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px}
.bar h1{font-size:13px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:var(--ink2);margin:0;flex:1}
.bar button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--base);border:0;border-radius:12px;padding:8px 14px;cursor:pointer;
  box-shadow:-4px -4px 9px var(--shL),4px 4px 9px var(--shD)}
.bar button:active{box-shadow:inset -3px -3px 7px var(--shL),inset 3px 3px 7px var(--shD)}
.hint{max-width:8.5in;margin:6px auto 0;padding:0 16px;font-size:12px;color:var(--ink2)}
/* US Letter sheet; the figure is sized for the 6.5 in text width between 1 in margins */
.sheet{width:8.5in;max-width:calc(100% - 32px);margin:14px auto 30px;background:var(--base);padding:0.5in 1in;
  box-shadow:-8px -8px 18px var(--shL),8px 8px 18px var(--shD);border-radius:6px}
#figure{background:var(--base);padding:10px 0}
#figure svg{display:block;width:100%;height:auto}
@media (max-width:700px){.sheet{padding:16px}}
@media print{.bar,.hint{display:none}html,body{background:#fff}.sheet{box-shadow:none;margin:0;padding:0}}
</style></head>
<body>
<div class="bar"><h1>Smart-Bin &middot; Study Feature Counts</h1>
<button onclick="document.body.classList.toggle('paper')">Beige / white</button></div>
<p class="hint">Screenshot the sheet below, or use the PNG saved beside this file. Beige follows the Smart-Bin app; white suits the paper.</p>

chor="end" dominant-baseline="central">Automatic lid</text><rect x="300" y="211" width="400" height="18" rx="9" fill="var(--well)" filter="url(#inset)"/><rect x="300" y="211" width="93.3" height="18" rx="9" fill="#0D8A8A" stroke="#2A241E" stroke-width="1.6"/><text x="405.3333333333333" y="220.0" font-size="10.5" font-weight="800" fill="var(--ink)" text-anchor="start" dominant-baseline="central">7</text><text x="286" y="250.0" font-size="10.5" font-weight="700" fill="var(--ink)" text-anchor="end" dominant-baseline="central">Weight</text><rect x="300" y="241" width="400" height="18" rx="9" fill="var(--well)" filter="url(#inset)"/><rect x="300" y="241" width="80.0" height="18" rx="9" fill="#0D8A8A" stroke="#2A241E" stroke-width="1.6"/><text x="392.0" y="250.0" font-size="10.5" font-weight="800" fill="var(--ink)" text-anchor="start" dominant-baseline="central">6</text><text x="286" y="280.0" font-size="10.5" font-weight="700" fill="var(--ink)" text-anchor="end" dominant-baseline="central">Gas or odor</text><rect x="300" y="271" width="400" height="18" rx="9" fill="var(--well)" filter="url(#inset)"/><rect x="300" y="271" width="80.0" height="18" rx="9" fill="#0D8A8A" stroke="#2A241E" stroke-width="1.6"/><text x="392.0" y="280.0" font-size="10.5" font-weight="800" fill="var(--ink)" text-anchor="start" dominant-baseline="central">6</text><text x="286" y="310.0" font-size="10.5" font-weight="700" fill="var(--ink)" text-anchor="end" dominant-baseline="central">Temperature or humidity</text><rect x="300" y="301" width="400" height="18" rx="9" fill="var(--well)" filter="url(#inset)"/><rect x="300" y="301" width="53.3" height="18" rx="9" fill="#0D8A8A" stroke="#2A241E" stroke-width="1.6"/><text x="365.3333333333333" y="310.0" font-size="10.5" font-weight="800" fill="var(--ink)" text-anchor="start" dominant-baseline="central">4</text><text x="286" y="340.0" font-size="10.5" font-weight="700" fill="var(--ink)" text-anchor="end" dominant-baseline="central">On-bin display</text><rect x="300" y="331" width="400" height="18" rx="9" fill="var(--well)" filter="url(#inset)"/><rect x="300" y="331" width="53.3" height="18" rx="9" fill="#0D8A8A" stroke="#2A241E" stroke-width="1.6"/><text x="365.3333333333333" y="340.0" font-size="10.5" font-weight="800" fill="var(--ink)" text-anchor="start" dominant-baseline="central">4</text><text x="286" y="370.0" font-size="10.5" font-weight="700" fill="var(--ink)" text-anchor="end" dominant-baseline="central">Role-based views</text><rect x="300" y="361" width="400" height="18" rx="9" fill="var(--well)" filter="url(#inset)"/><rect x="300" y="361" width="26.7" height="18" rx="9" fill="#0D8A8A" stroke="#2A241E" stroke-width="1.6"/><text x="338.6666666666667" y="370.0" font-size="10.5" font-weight="800" fill="var(--ink)" text-anchor="start" dominant-baseline="central">2</text><text x="286" y="400.0" font-size="10.5" font-weight="700" fill="var(--ink)" text-anchor="end" dominant-baseline="central">Tilt or tamper</text><rect x="300" y="391" width="400" height="18" rx="9" fill="var(--well)" filter="url(#inset)"/><rect x="300" y="391" width="18.0" height="18" rx="9" fill="#D93025" stroke="#2A241E" stroke-width="1.6"/><text x="330" y="400.0" font-size="10.5" font-weight="800" fill="var(--ink)" text-anchor="start" dominant-baseline="central">1</text><text x="286" y="430.0" font-size="10.5" font-weight="700" fill="var(--ink)" text-anchor="end" dominant-baseline="central">User access (PIN or RFID)</text><rect x="300" y="421" width="400" height="18" rx="9" fill="var(--well)" filter="url(#inset)"/><rect x="300" y="421" width="18.0" height="18" rx="9" fill="#0D8A8A" stroke="#2A241E" stroke-width="1.6"/><text x="330" y="430.0" font-size="10.5" font-weight="800" fill="var(--ink)" text-anchor="start" dominant-baseline="central">1</text><text x="286" y="460.0" font-size="10.5" font-weight="700" fill="var(--ink)" text-anchor="end" dominant-baseline="central">Calibration or simulation from the UI</text><rect x="300" y="451" width="400" height="18" rx="9" fill="var(--well)" filter="url(#inset)"/><text x="312" y="460.0" font-size="10.5" font-weight="800" fill="var(--ink)" text-anchor="start" dominant-baseline="central">0</text><text x="700" y="494" font-size="9.5" font-weight="700" fill="var(--ink2)" text-anchor="end">full width = 30 studies</text></svg></div></div>
