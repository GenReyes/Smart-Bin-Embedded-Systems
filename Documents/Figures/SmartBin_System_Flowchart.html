<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Flowchart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#D9D0C5;--base:#E4DCD2;--shL:#FFFBF5;--shD:#BEB2A4;--ink:#2A241E;--ink2:#6E6458;--line:#3D352D}
body.paper{--page:#ECECEC;--base:#FFFFFF;--shL:#FFFFFF;--shD:#D2D2D2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
.bar{max-width:8.5in;margin:18px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px}
.bar h1{font-size:13px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:var(--ink2);margin:0;flex:1}
.bar button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--base);border:0;border-radius:12px;padding:8px 14px;cursor:pointer;
  box-shadow:-4px -4px 9px var(--shL),4px 4px 9px var(--shD)}
.bar button:active{box-shadow:inset -3px -3px 7px var(--shL),inset 3px 3px 7px var(--shD)}
.hint{max-width:8.5in;margin:6px auto 0;padding:0 16px;font-size:12px;color:var(--ink2)}
/* US Letter sheet; the figure is sized for the 6.5 in text width between 1 in margins */
.sheet{width:8.5in;max-width:calc(100% - 32px);margin:14px auto 30px;background:var(--base);padding:0.5in 1in;
  box-shadow:-8px -8px 18px var(--shL),8px 8px 18px var(--shD);border-radius:6px}
#figure{background:var(--base);padding:10px 0}
#figure svg{display:block;width:100%;height:auto}
@media (max-width:700px){.sheet{padding:16px}}
@media print{.bar,.hint{display:none}html,body{background:#fff}.sheet{box-shadow:none;margin:0;padding:0}}
</style></head>
<body>
<div class="bar"><h1>Smart-Bin &middot; System Flowchart</h1>
<button onclick="document.body.classList.toggle('paper')">Beige / white</button></div>

#ar)"/><polyline points="545,132.0 545,194.0" fill="none" stroke="var(--line)" stroke-width="1.7" stroke-linejoin="miter" marker-end="url(#ar)"/><polyline points="545,250.0 545,306.0" fill="none" stroke="var(--line)" stroke-width="1.7" stroke-linejoin="miter" marker-end="url(#ar)"/><polyline points="545,362.0 545,424.0" fill="none" stroke="var(--line)" stroke-width="1.7" stroke-linejoin="miter" marker-end="url(#ar)"/><polyline points="545,468.0 545,530.0" fill="none" stroke="var(--line)" stroke-width="1.7" stroke-linejoin="miter" marker-end="url(#ar)"/><polyline points="545,586.0 545,635.0" fill="none" stroke="var(--line)" stroke-width="1.7" stroke-linejoin="miter" marker-end="url(#ar)"/><polyline points="545,702.0 545,766.0" fill="none" stroke="var(--line)" stroke-width="1.7" stroke-linejoin="miter" marker-end="url(#ar)"/><polyline points="605,782 686,782 686,26 260,26" fill="none" stroke="var(--line)" stroke-width="1.7" stroke-linejoin="miter" marker-end="url(#ar)" stroke-dasharray="7 5"/><polyline points="559.0,868 587.0,868" fill="none" stroke="var(--line)" stroke-width="1.7" stroke-linejoin="miter" marker-end="url(#ar)" stroke-dasharray="7 5"/><rect x="140.0" y="10.0" width="120" height="32" rx="16.0" fill="#D4E2CF" stroke="#1E8E3E" stroke-width="2.4" filter="url(#nm)"/><text x="200" y="26.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">START</text><rect x="65.0" y="66.0" width="270" height="40" rx="3" fill="#E3D6E2" stroke="#7A45B5" stroke-width="2.4" filter="url(#nm)"/><text x="200" y="79.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Bin switched on: ESP32 boots,</text><text x="200" y="93.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">joins Wi-Fi and reads the sensors</text><polygon points="77.0,126.0 335.0,126.0 323.0,166.0 65.0,166.0" stroke-linejoin="round" fill="#D4DDE0" stroke="#1F6F "#1F6FA8" stroke-width="2.4" filter="url(#nm)"/><text x="110" y="375.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">User drops</text><text x="110" y="389.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">the trash in</text><rect x="65.0" y="432.0" width="270" height="52" rx="3" fill="#E3D6E2" stroke="#7A45B5" stroke-width="2.4" filter="url(#nm)"/><text x="200" y="444.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Lid closes 5 s after motion stops;</text><text x="200" y="458.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">HC-SR04, HX711 and BME680 measure</text><text x="200" y="472.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">fill, weight, temperature and air</text><polygon points="77.0,502.0 335.0,502.0 323.0,542.0 65.0,542.0" stroke-linejoin="round" fill="#D4DDE0" stroke="#1F6FA8" stroke-width="2.4" filter="url(#nm)"/><text x="200" y="515.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">RGB LED and touchscreen</text><text x="200" y="529.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">show the fill level</text><path transform="translate(22.0,567.0) scale(1.7600,0.9688)" vector-effect="non-scaling-stroke" d="M22,60 A15,15 0 0 1 12,33 A16,16 0 0 1 34,14 A21,21 0 0 1 70,11 A17,17 0 0 1 91,31 A15,15 0 0 1 80,60 Z" fill="#F2DBCA" stroke="#D9631E" stroke-width="2.4" filter="url(#nm)"/><text x="110" y="595.3" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Firebase</text><text x="110" y="609.3" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">live status</text><path transfor size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Collector empties the bin</text><text x="545" y="453.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">and taps DONE</text><rect x="430.0" y="530.0" width="230" height="56" rx="3" fill="#E3D6E2" stroke="#7A45B5" stroke-width="2.4" filter="url(#nm)"/><text x="545" y="544.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Lid closes; fill resets to</text><text x="545" y="558.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">about 0 %, LED turns green,</text><text x="545" y="572.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">monitoring resumes</text><path transform="translate(445.0,635.0) scale(2.0000,1.0938)" vector-effect="non-scaling-stroke" d="M22,60 A15,15 0 0 1 12,33 A16,16 0 0 1 34,14 A21,21 0 0 1 70,11 A17,17 0 0 1 91,31 A15,15 0 0 1 80,60 Z" fill="#F2DBCA" stroke="#D9631E" stroke-width="2.4" filter="url(#nm)"/><text x="545" y="667.9" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Firebase and ThingSpeak</text><text x="545" y="681.9" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">log the pickup</text><rect x="485.0" y="766.0" width="120" height="32" rx="16.0" fill="#D4E2CF" stroke="#1E8E3E" stroke-width="2.4" filter="url(#nm)"/><text x="545" y="782.0" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">END</text><rect x="63.0" y="859.0" width="34" height="18" rx="9.0" fill="#D4E2CF" stroke="#1E8E3E" stroke-width="2.4" filter="url(#nm)"/><rect x="165.0" y="859.0" width="34" height="18" rx="3" fill="#E3D6E2" stroke="#7A45B5" stroke-width="2.4" filter="url(#nm)"/><polygon points="274.0,857.0 28
