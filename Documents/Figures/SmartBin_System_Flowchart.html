<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Flowchart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#D9D0C5;--base:#E4DCD2;--shL:#FFFBF5;--shD:#BEB2A4;--ink:#2A241E;--ink2:#6E6458;--line:#2A241E;--well:#DED5CA}
body.paper{--page:#ECECEC;--base:#FFFFFF;--shL:#FFFFFF;--shD:#CFCFCF;--well:#F1F1F1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
.bar{max-width:8.5in;margin:18px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px}
.bar h1{font-size:13px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:var(--ink2);margin:0;flex:1}
.bar button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--base);border:0;border-radius:12px;padding:8px 14px;cursor:pointer;
  box-shadow:-4px -4px 9px var(--shL),4px 4px 9px var(--shD)}
.bar button:active{box-shadow:inset -3px -3px 7px var(--shL),inset 3px 3px 7px var(--shD)}
.hint{max-width:8.5in;margin:6px auto 0;padding:0 16px;font-size:12px;color:var(--ink2)}
/* US Letter sheet; the figure is sized for the 6.5 in text width between 1 in margins */
.sheet{width:8.5in;max-width:calc(100% - 32px);margin:14px auto 30px;background:var(--base);padding:0.5in 1in;
  box-shadow:-8px -8px 18px var(--shL),8px 8px 18px var(--shD);border-radius:6px}
#figure{background:var(--base);padding:10px 0}
#figure svg{display:block;width:100%;height:auto}
@media (max-width:700px){.sheet{padding:16px}}
@media print{.bar,.hint{display:none}html,body{background:#fff}.sheet{box-shadow:none;margin:0;padding:0}}
</style></head>

t="16.5" rx="5" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="1148.5625" y="492.55" width="32.875" height="16.5" rx="5" fill="#1E8E3E" stroke="#2A241E" stroke-width="2.2"/><text x="1165" y="501.3" font-size="7.5" font-weight="800" letter-spacing="1" fill="#fff" text-anchor="middle" dominant-baseline="central">YES</text><rect x="1243.375" y="494.55" width="27.25" height="16.5" rx="5" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="1241.375" y="492.55" width="27.25" height="16.5" rx="5" fill="#D93025" stroke="#2A241E" stroke-width="2.2"/><text x="1255" y="501.3" font-size="7.5" font-weight="800" letter-spacing="1" fill="#fff" text-anchor="middle" dominant-baseline="central">NO</text><rect x="572.0" y="759.1999999999998" width="196" height="40" rx="6" fill="#EEE7F5" stroke="#7A45B5" stroke-width="2" filter="url(#nm)"/><text x="670" y="773.0" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">UPDATE status</text><text x="670" y="785.4" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">&amp; alerts</text><path transform="translate(395.0,748.1999999999998) scale(1.5000,0.9688)" vector-effect="non-scaling-stroke" d="M22,60 A15,15 0 0 1 12,33 A16,16 0 0 1 34,14 A21,21 0 0 1 70,11 A17,17 0 0 1 91,31 A15,15 0 0 1 80,60 Z" fill="#FAEBE2" stroke="#D9631E" stroke-width="2" filter="url(#nm)"/><text x="470" y="784.2" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Firebase</text><path transform="translate(795.0,748.1999999999998) scale(1.5000,0.9688)" vector-effect="non-scaling-stroke" d="M22,60 A15,15 0 0 1 12,33 A16,16 0 0 1 34,14 A21,21 0 0 1 70,11 A17,17 0 0 1 91,31 A15,15 0 0 1 80,60 Z" fill="#FAEBE2" stroke="#D9631E" stroke-width="2" filter="url(#nm)"/><text x="870" y="784.2" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">ThingSpeak</text><polygon points="565.0,821.1999999999998 788.0,821.1999999999998 775.0,861.1999999999998 552.0,861.1999999999998" stroke-linejoin="round" fill="#E2ECF4" stroke="#1F6FA8" stroke-width="2" filter="url(#nm)"/><text x="670" y="835.0" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Show on SCREEN, LED</text><text x="670" y="847.4" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">&amp; apps</text><rect x="616.0" y="886.1999999999998" width="116" height="30" rx="15.0" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="612.0" y="882.1999999999998" width="116" height="30" rx="15.0" fill="#1E8E3E" stroke="#2A241E" stroke-width="2.2"/><text x="670" y="897.6999999999998" font-size="12" font-weight="800" letter-spacing="2" fill="#fff" text-anchor="middle" dominant-baseline="central">END</text><text x="62" y="70" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">How it runs.</tspan><tspan font-weight="500" fill="#4A4036"> After boot (which saves the resting angle as upright) the seven parts below run</tspan></text><text x="62" y="81.4" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">side by side on every pass of the loop, then one UPDATE sends the result out.</text><text x="62" y="99.8" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Wi-Fi setup.</tspan><tspan font-weight="500" fill="#4A4036"> Info &gt; WI-FI SETUP on the touchscreen, then the collect PIN. The app or dashboard</tspan></text><text x="62" y="111.2" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">pairs over Bluetooth with the 6-digit code (skipped for a device paired before); 3</text><text x="62" y="122.6" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">wrong codes stop pairing for 60 s. Collectors and operators can both do it.</text><circle cx="48" cy="141.0" r="8" fill="#2A241E"/><text x="48" y="141.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">1</text><text x="62" y="141.0" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Lid.</tspan><tspan font-weight="500" fill="#4A4036"> Opens only when the bin is free (not locked, tampered, collecting or calibrating).</tspan></text><text x="62" y="152.4" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">Motion at a locked bin gives a warning beep instead. Once closed the lid stays shut 2</text><text x="62" y="163.8" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">s (settable) so it does not flicker.</text><circle cx="48" cy="182.2" r="8" fill="#2A241E"/><text x="48" y="182.7" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">2</text><text x="62" y="182.2" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Fill.</tspan><tspan font-weight="500" fill="#4A4036"> HC-SR04 (median of 5) gives fill %, HX711 the weight (&quot;not answering&quot; when unplugged).</tspan></text><text x="62" y="193.6" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">At the limit (80% default) the FULL beep repeats every 30 s until COLLECT or LOCK;</text><text x="62" y="205.0" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">auto-lock is a setting.</text><circle cx="48" cy="753.1999999999998" r="8" fill="#2A241E"/><text x="48" y="753.6999999999998" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">3</text><text x="62" y="753.1999999999998" font-size="9" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Air.</tspan><tspan font-weight="500" fill="#4A4036"> BME680 temperature, humidity and estimated IAQ (about 5 min</tspan></text><text x="62" y="764.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">warm-up) against their limits (40C, 85%, 200). The warning</text><text x="62" y="775.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">repeats every 5 min.</text><circle cx="48" cy="793.1999999999998" r="8" fill="#2A241E"/><text x="48" y="793.6999999999998" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">4</text><text x="62" y="793.1999999999998" font-size="9" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Tamper.</tspan><tspan font-weight="500" fill="#4A4036"> Over 30° from the upright saved at boot, the BMI160 starts a</tspan></text><text x="62" y="804.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">10 s countdown with ticks. Level again clears it. Still</text><text x="62" y="815.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">tilted, the alarm latches: the siren repeats every 2 s and</text><text x="62" y="826.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">the lid stays shut until an operator sends RESET TAMPER.</text><circle cx="48" cy="844.1999999999998" r="8" fill="#2A241E"/><text x="48" y="844.6999999999998" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">5</text><text x="62" y="844.1999999999998" font-size="9" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Screen.</tspan><tspan font-weight="500" fill="#4A4036"> Every key beeps. COLLECT needs the collect PIN, mutes the</tspan></text><text x="62" y="855.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">alarms and opens the lid; DONE ends it. Holding a finger on</text><text x="62" y="866.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">the screen for 5 s starts touch calibration.</text><circle cx="980" cy="753.1999999999998" r="8" fill="#2A241E"/><text x="980" y="753.6999999999998" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">6</text><text x="994" y="753.1999999999998" font-size="9" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Commands.</tspan><tspan font-weight="500" fill="#4A4036"> The bin refuses unsafe ones: COLLECT during tamper or</tspan></text><text x="994" y="764.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">calibration, LOCK or CAL during a pickup. CAL and SIM need</text><text x="994" y="775.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">local Wi-Fi.</text><circle cx="980" cy="793.1999999999998" r="8" fill="#2A241E"/><text x="980" y="793.6999999999998" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">7</text><text x="994" y="793.1999999999998" font-size="9" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Network.</tspan><tspan font-weight="500" fill="#4A4036"> Beeps once when Wi-Fi drops or returns. The cloud retries</tspan></text><text x="994" y="804.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">after 5, 15, 30 and 60 s.</text><text x="994" y="822.1999999999998" font-size="9" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Cloud.</tspan><tspan font-weight="500" fill="#4A4036"> UPDATE is two-way: readings and alerts go up, LOCK, UNLOCK</tspan></text><text x="994" y="833.2" font-size="9" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">and COLLECT come down.</text><rect x="396.0" y="937.6999999999998" width="32" height="15" rx="7.5" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="394.0" y="935.6999999999998" width="32" height="15" rx="7.5" fill="#1E8E3E" stroke="#2A241E" stroke-width="2.2"/><text x="432.0" y="943.2" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Start / End</text><rect x="498.0" y="934.1999999999998" width="32" height="18" rx="4" fill="#EEE7F5" stroke="#7A45B5" stroke-width="2"/><text x="536.0" y="943.2" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Process</text><polygon points="604.0,935.6999999999998 617.0,945.1999999999998 604.0,954.6999999999998 591.0,945.1999999999998" stroke-linejoin="round" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><polygon points="602.0,933.6999999999998 615.0,943.1999999999998 602.0,952.6999999999998 589.0,943.1999999999998" stroke-linejoin="round" fill="#E0962A" stroke="#2A241E" stroke-width="2.2"/><text x="624.0" y="943.2" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Decision</text><polygon points="691.0,934.1999999999998 710.0,934.1999999999998 697.0,952.1999999999998 678.0,952.1999999999998" stroke-linejoin="round" fill="#E2ECF4" stroke="#1F6FA8" stroke-width="2"/><text x="716.0" y="943.2" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Input / Output</text><path transform="translate(798.0,932.1999999999998) scale(0.3200,0.3438)" vector-effect="non-scaling-stroke" d="M22,60 A15,15 0 0 1 12,33 A16,16 0 0 1 34,14 A21,21 0 0 1 70,11 A17,17 0 0 1 91,31 A15,15 0 0 1 80,60 Z" fill="#FAEBE2" stroke="#D9631E" stroke-width="2"/><text x="836.0" y="943.2" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Cloud</text><text x="910.0" y="943.2" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Repeat</text></svg></div></div>
