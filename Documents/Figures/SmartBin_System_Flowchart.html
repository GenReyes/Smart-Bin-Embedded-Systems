<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Flowchart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#D9D0C5;--base:#E4DCD2;--shL:#FFFBF5;--shD:#BEB2A4;--ink:#2A241E;--ink2:#6E6458;--line:#2A241E;--well:#DED5CA}
body.paper{--page:#ECECEC;--base:#FFFFFF;--shL:#FFFFFF;--shD:#CFCFCF;--well:#F1F1F1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
.bar{max-width:8.5in;margin:18px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px}
.bar h1{font-size:13px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:var(--ink2);margin:0;flex:1}
.bar button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--base);border:0;border-radius:12px;padding:8px 14px;cursor:pointer;
  box-shadow:-4px -4px 9px var(--shL),4px 4px 9px var(--shD)}
.bar button:active{box-shadow:inset -3px -3px 7px var(--shL),inset 3px 3px 7px var(--shD)}
.hint{max-width:8.5in;margin:6px auto 0;padding:0 16px;font-size:12px;color:var(--ink2)}
/* US Letter sheet; the figure is sized for the 6.5 in text width between 1 in margins */
.sheet{width:8.5in;max-width:calc(100% - 32px);margin:14px auto 30px;background:var(--base);padding:0.5in 1in;
  box-shadow:-8px -8px 18px var(--shL),8px 8px 18px var(--shD);border-radius:6px}
#figure{background:var(--base);padding:10px 0}
#figure svg{display:block;width:100%;height:auto}
@media (max-width:700px){.sheet{padding:16px}}
@media print{.bar,.hint{display:none}html,body{background:#fff}.sheet{box-shadow:none;margin:0;padding:0}}
</style></head>

ak</text><polygon points="448.0,728.0 665.0,728.0 652.0,764.0 435.0,764.0" stroke-linejoin="round" fill="#E2ECF4" stroke="#1F6FA8" stroke-width="2" filter="url(#nm)"/><text x="550" y="739.8" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Show on SCREEN, LED</text><text x="550" y="752.2" font-size="10.2" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">&amp; apps</text><rect x="496.0" y="789.0" width="116" height="30" rx="15.0" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="492.0" y="785.0" width="116" height="30" rx="15.0" fill="#1E8E3E" stroke="#2A241E" stroke-width="2.2"/><text x="550" y="800.5" font-size="12" font-weight="800" letter-spacing="2" fill="#fff" text-anchor="middle" dominant-baseline="central">END</text><text x="62" y="70" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">How it runs.</tspan><tspan font-weight="500" fill="#4A4036"> After boot the five parts below run side by side on</tspan></text><text x="62" y="81.4" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">every pass of the loop, then one UPDATE sends</text><text x="62" y="92.8" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">everything out.</text><text x="62" y="111.2" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Wi-Fi.</tspan><tspan font-weight="500" fill="#4A4036"> With no saved Wi-Fi the bin waits for the app or dashboard</tspan></text><text x="62" y="122.6" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">to send it over Bluetooth.</text><circle cx="48" cy="141.0" r="8" fill="#2A241E"/><text x="48" y="141.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">1</text><text x="62" y="141.0" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Lid.</tspan><tspan font-weight="500" fill="#4A4036"> Opens only when the bin is not locked, tampered or</tspan></text><text x="62" y="152.4" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">collecting; shuts 5 s after motion stops.</text><circle cx="48" cy="170.8" r="8" fill="#2A241E"/><text x="48" y="171.3" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">2</text><text x="62" y="170.8" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Fill.</tspan><tspan font-weight="500" fill="#4A4036"> HC-SR04 (median of 5) gives fill %, HX711 gives weight. At</tspan></text><text x="62" y="182.2" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">80 % the bin alerts and auto-locks if set.</text><circle cx="814" cy="70" r="8" fill="#2A241E"/><text x="814" y="70.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">3</text><text x="828" y="70" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Air.</tspan><tspan font-weight="500" fill="#4A4036"> BME680 temperature, humidity and air quality</tspan></text><text x="828" y="81.4" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">(IAQ) against the set limits.</text><circle cx="814" cy="99.8" r="8" fill="#2A241E"/><text x="814" y="100.3" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">4</text><text x="828" y="99.8" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Tamper.</tspan><tspan font-weight="500" fill="#4A4036"> BMI160 tilt starts a 10 s alarm; steady</tspan></text><text x="828" y="111.2" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">again clears it, still tilted locks it.</text><circle cx="814" cy="129.6" r="8" fill="#2A241E"/><text x="814" y="130.1" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">5</text><text x="828" y="129.6" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Commands.</tspan><tspan font-weight="500" fill="#4A4036"> From the app, dashboard or touchscreen</tspan></text><text x="828" y="141.0" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">PIN. CAL and SIM work over Wi-Fi only.</text><text x="828" y="159.4" font-size="9.2" dominant-baseline="central" fill="#2A241E"><tspan font-weight="800">Cloud.</tspan><tspan font-weight="500" fill="#4A4036"> UPDATE is two-way: readings go up, LOCK,</tspan></text><text x="828" y="170.8" font-size="9.2" font-weight="500" fill="#4A4036" text-anchor="start" dominant-baseline="central">UNLOCK and COLLECT come down.</text><rect x="276.0" y="840.5" width="32" height="15" rx="7.5" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><rect x="274.0" y="838.5" width="32" height="15" rx="7.5" fill="#1E8E3E" stroke="#2A241E" stroke-width="2.2"/><text x="312.0" y="846.0" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Start / End</text><rect x="378.0" y="837.0" width="32" height="18" rx="4" fill="#EEE7F5" stroke="#7A45B5" stroke-width="2"/><text x="416.0" y="846.0" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Process</text><polygon points="484.0,838.5 497.0,848 484.0,857.5 471.0,848" stroke-linejoin="round" fill="#2A241E" stroke="#2A241E" stroke-width="2.2"/><polygon points="482.0,836.5 495.0,846 482.0,855.5 469.0,846" stroke-linejoin="round" fill="#E0962A" stroke="#2A241E" stroke-width="2.2"/><text x="504.0" y="846.0" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Decision</text><polygon points="571.0,837.0 590.
